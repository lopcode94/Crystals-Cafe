const DEV_STORAGE_KEY = 'cookDash.customSprites.v1';
const DEV_TWEAK_KEY = 'cookDash.spriteTweaks.v1';   // per-sprite size/position from "Adjust size"
const DEV_TWEAK_TIME_KEY = 'cookDash.spriteTweaks.changedAt';
// Settings stored as-is (px, degrees, %) with their defaults; every other slider stores a 0–1 fraction.
const RAW_TWEAKS = { x: 0, y: 0, rot: 0, hue: 0, sat: 100, bright: 100 };
const isDevAssetKey = k => DEV_ASSETS.some(a => a.key === k) || /^rig_[a-z0-9]+_[A-Za-z]+$/.test(k);   // asset rows + cook-rig body parts
const isDefaultTweak = (k, v) => v == null || (k === 'scale' ? v === 1 : k in RAW_TWEAKS ? v === RAW_TWEAKS[k] : false);   // when those were last changed (vs. the project file's savedAt)
const DEV_MAX_SIDE = 768;   // uploads larger than this are downscaled so they fit in localStorage (sharp up to ~2.5× zoom)

const readAsDataURL = file => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.onerror = () => reject(new Error('The file could not be read.'));
  r.readAsDataURL(file);
});
const loadImage = src => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error('That file is not a readable image.'));
  img.src = src;
});
async function shrinkDataURL(url) {
  const img = await loadImage(url);
  const s = Math.min(1, DEV_MAX_SIDE / Math.max(img.width, img.height));
  if (s === 1) return { url, img };
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const small = c.toDataURL('image/png');
  return { url: small, img: await loadImage(small) };
}

// Makes a drawing on a white page usable as a sprite: flood-fills the white background from the
// edges (so white eyes and highlights inside the outline stay), softens the leftover halo, then
// trims transparent margins so the feet sit on the bottom edge. Returns null if nothing changed.
async function cleanupSprite(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  const W = c.width, H = c.height, d = g.getImageData(0, 0, W, H), p = d.data;
  // white page OR a "fake transparency" checkerboard baked into the image (light neutral greys)
  const isBg = k => { const i = k * 4, r = p[i], gr = p[i + 1], b = p[i + 2];
    return p[i + 3] > 200 && r > 195 && gr > 195 && b > 195 && Math.max(r, gr, b) - Math.min(r, gr, b) < 18; };
  let border = 0, white = 0;
  for (let x = 0; x < W; x++) for (const y of [0, H - 1]) { border++; if (isBg(y * W + x)) white++; }
  for (let y = 0; y < H; y++) for (const x of [0, W - 1]) { border++; if (isBg(y * W + x)) white++; }
  const removedBg = white / border > 0.75;
  const seen = new Uint8Array(W * H);
  if (removedBg) {
    const stack = [];
    const push = k => { if (!seen[k] && isBg(k)) { seen[k] = 1; stack.push(k); } };
    for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (stack.length) {
      const k = stack.pop(), x = k % W;
      p[k * 4 + 3] = 0;
      if (x > 0) push(k - 1); if (x < W - 1) push(k + 1); if (k >= W) push(k - W); if (k < W * (H - 1)) push(k + W);
    }
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {     // fade light pixels on the cut edge
      const k = y * W + x; if (seen[k] || !(seen[k - 1] || seen[k + 1] || seen[k - W] || seen[k + W])) continue;
      const i = k * 4, light = Math.min(p[i], p[i + 1], p[i + 2]);
      if (light > 160) p[i + 3] = Math.round(255 * (255 - light) / 95);
    }
    g.putImageData(d, 0, 0);
  }
  let x0 = W, y0 = H, x1 = -1, y1 = -1;                                     // trim to visible pixels
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (p[(y * W + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const trimmed = x0 > 0 || y0 > 0 || x1 < W - 1 || y1 < H - 1;
  if (!removedBg && !trimmed) return null;
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  const url = out.toDataURL('image/png');
  return { url, img: await loadImage(url), removedBg };
}

// Your own handwriting font: put it in cook-dash/assets as ui-font.ttf, ui-font.otf or ui-font.woff2 and it
// replaces the Google font everywhere (registered as "GameUI", first in FONT). Missing file = nothing happens.
async function loadCustomFont() {
  if (!window.FontFace || location.protocol === 'file:') return;
  for (const ext of ['woff2', 'ttf', 'otf']) {
    try {
      const face = await new FontFace('GameUI', `url(assets/ui-font.${ext})`).load();
      document.fonts.add(face); console.info(`Using assets/ui-font.${ext} for the interface.`);
      THEME.inkWeight = THEME.customFontInkWeight;    // a real brush/marker font needs little or no faux-bold
      return;
    } catch (e) { /* not there; try the next format */ }
  }
}

// Loads art saved with "Save to project": assets/sprites.json lists each image and the size settings.
// Works anywhere the game is served over http(s) (local server, Live Server, the published link);
// opened straight from disk (file://) it quietly finds nothing and the vector art is used.
async function loadProjectAssets() {
  let m;
  try { const res = await fetch('assets/sprites.json', { cache: 'no-store' }); if (!res.ok) return; m = await res.json(); }
  catch (e) { return; }
  const v = encodeURIComponent(m.savedAt || '');
  for (const [key, src] of Object.entries(m.sprites || {})) {
    try {
      const img = await loadImage(`${src}?v=${v}`);
      Sprites.project[key] = { def: sheetDef(key, img, { src, autoFit: true }), img, ready: true };
      if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
    } catch (e) { console.warn(`Project sprite "${key}" could not be loaded from ${src}.`); }
  }
  // sizes saved in this browser win over the project's
  // Size/rig settings: whichever was saved more recently wins, setting by setting (the other fills any gaps).
  const projectNewer = (Date.parse(m.savedAt) || 0) >= DevAssets.localTweakTime;
  for (const [key, t] of Object.entries(m.tweaks || {})) {
    if (!t || typeof t !== 'object') continue;
    const local = DevAssets.localTweaks[key] || {};
    Sprites.tweaks[key] = projectNewer ? { ...local, ...t } : { ...t, ...local };
  }
  StaticLayer.invalidate();
  for (const { key } of DEV_ASSETS) if (DevAssets.rows[key]) DevAssets.refresh(key);
  for (const L of UI_LAYOUT) DevAssets.refreshLayout(L.id);
  DevAssets.refreshDither();
}

const DevAssets = {
  localTweaks: {}, localTweakTime: 0,   // settings saved in this browser, and when they were last changed
  panel: null, rows: {}, saved: {}, isOpen: false, lastFocus: null, previews: [],

  // Animates the walk preview of each open character row (called every frame while the panel is open).
  tickPreviews(t) {
    for (const pv of this.previews) {
      const entry = Sprites.entry(pv.key);
      if (!pv.size.open || pv.size.hidden || !entry || !entry.img) continue;
      const g = pv.canvas.getContext('2d'), w = pv.canvas.width, h = pv.canvas.height;
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
      const isAngry = pv.key.endsWith('_angry');
      const tw = spriteTweaks(pv.key), R = k => tw[k] ?? RIG_DEFAULTS[k];
      const nx = tw.x || 0, ny = tw.y || 0;                                        // preview cancels the position nudges
      const fitH = 96, sc = fitH / entry.img.height * (tw.scale ?? 1);
      const IW = entry.img.width * sc, IH = entry.img.height * sc, x0 = w / 2 - IW / 2, y0 = h - 12 - IH;
      // guides: hip (orange), shoulder/hand + arm cuts (blue), eye (green)
      g.setLineDash([4, 3]); g.lineWidth = 1;
      const hl = (y, col) => { g.strokeStyle = col; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); };
      hl(y0 + R('hip') * IH, 'rgba(224,166,74,0.7)');
      g.strokeStyle = 'rgba(224,166,74,0.7)'; g.beginPath(); g.moveTo(x0 + R('legX') * IW, y0 + R('hip') * IH); g.lineTo(x0 + R('legX') * IW, y0 + IH); g.stroke();   // leg split
      if (R('armX') > 0) {
        hl(y0 + R('shoulder') * IH, 'rgba(120,180,255,0.6)'); hl(y0 + R('hand') * IH, 'rgba(120,180,255,0.6)');
        for (const xx of [x0 + R('armX') * IW, x0 + IW - R('armX') * IW]) { g.beginPath(); g.moveTo(xx, y0 + R('shoulder') * IH); g.lineTo(xx, y0 + R('hand') * IH); g.stroke(); }
      }
      if (R('eyeR') > 0) { g.strokeStyle = 'rgba(140,230,120,0.8)'; g.beginPath(); g.arc(x0 + R('eyeX') * IW, y0 + R('eyeY') * IH, R('eyeR') * IW * 1.15, 0, Math.PI * 2); g.stroke(); }
      g.setLineDash([]);
      // 3.6 s loop: walk 1.6 s, grab, pause, place
      const u = t % 3.6, moving = u < 1.6;
      const action = u >= 1.8 && u < 2.2 ? { type: 'grab', t: u - 1.8 } : u >= 2.6 && u < 3.0 ? { type: 'place', t: u - 2.6 } : null;
      drawCharacterSprite(g, pv.key, w / 2 - nx, h - 12 + ny, { t, moving, facing: 1, fitH, action: isAngry ? null : action, shadow: false, angry: isAngry });
    }
  },

  async init() {
    this.build();
    try {
      const local = JSON.parse(localStorage.getItem(DEV_TWEAK_KEY) || '{}') || {};
      Object.assign(Sprites.tweaks, local); this.localTweaks = local;
      this.localTweakTime = Number(localStorage.getItem(DEV_TWEAK_TIME_KEY)) || 0;
    } catch (e) {}
    for (const L of UI_LAYOUT) this.refreshLayout(L.id);
    this.refreshDither();
    this.saved = this.readStore();
    for (const [key, url] of Object.entries(this.saved)) {
      if (!isDevAssetKey(key)) continue;
      try { this.install(key, await loadImage(url), url); this.setStatus(key, "Custom sprite (saved)", "ok"); }
      catch (e) { delete this.saved[key]; this.setStatus(key, 'Saved sprite was unreadable and was removed.', 'err'); }
      if (DEV_ASSETS.some(a => a.key === key)) this.refresh(key);   // cook-rig parts have no row of their own
    }
    this.writeStore();
    this.refreshRig();
  },

  readStore() {
    try { const v = JSON.parse(localStorage.getItem(DEV_STORAGE_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; }
    catch (e) { return {}; }
  },
  writeStore() {
    try {
      if (Object.keys(this.saved).length) localStorage.setItem(DEV_STORAGE_KEY, JSON.stringify(this.saved));
      else localStorage.removeItem(DEV_STORAGE_KEY);
      return true;
    } catch (e) { return false; }   // storage full, blocked or unavailable
  },

  install(key, img, url) {
    Sprites.custom[key] = { def: sheetDef(key, img, { src: url, autoFit: true }), img, ready: true };
    if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
  },

  async handleFile(key, file) {
    if (!file) return;
    if (!/^image\/(png|webp|gif|jpeg)$/.test(file.type)) { this.setStatus(key, 'Choose a PNG (or WebP/JPEG) image.', 'err'); return; }
    this.setStatus(key, 'Loading…');
    try {
      const raw = await readAsDataURL(file);
      let { url, img } = await shrinkDataURL(raw), note = '';
      const kind = (DEV_ASSETS.find(a => a.key === key) || {}).kind;
      if (kind !== 'tile') {                       // drawings on white: cut the background out and trim empty margins
                                                   // (full-bleed images have no white edge, so they pass through unchanged)
        const cut = await cleanupSprite(img);
        if (cut) { ({ url, img } = cut); note = cut.removedBg ? ' · white background removed' : ' · trimmed'; }
      }
      this.install(key, img, url);
      this.saved[key] = url;
      if (this.writeStore()) {
        this.setStatus(key, `${file.name} · ${img.width}×${img.height}${note} · saved`, 'ok');
      } else {
        delete this.saved[key]; this.writeStore();
        this.setStatus(key, `${file.name} is loaded, but browser storage is full or blocked, so it will reset on reload.`, 'err');
      }
      Events.emit('devAssetChanged', { key });
    } catch (e) {
      this.setStatus(key, e.message, 'err');
    }
    this.refresh(key);
  },

  // ---- Save to project: sends this browser's uploads + all size settings to the local game server,
  // which writes them to cook-dash/assets/ (see serve.ps1). Only works through that server.
  async saveToProject() {
    const sprites = {};
    for (const key of Object.keys(Sprites.custom)) if (isDevAssetKey(key)) sprites[key] = Sprites.custom[key].def.src;
    const note = this.foot.note;
    note.textContent = 'Saving to project…';
    try {
      const res = await fetch('/__save-assets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sprites, tweaks: Sprites.tweaks }) });
      if (!res.ok) throw new Error(res.status === 404 || res.status === 405 ? 'no-server' : `The server answered ${res.status}.`);
      const out = await res.json();
      for (const k of out.saved || []) { Sprites.project[k] = Sprites.custom[k]; this.setStatus(k, 'Saved to project files', 'ok'); }
      this.refreshRig();
      note.textContent = `Saved ${out.saved.length} image(s) and all sizes to cook-dash/assets/.`;
    } catch (e) {
      note.textContent = e.message === 'no-server' || e instanceof TypeError
        ? 'Saving needs the game\'s own local server at localhost:5500 (ask Claude to start it). Your uploads are still kept in this browser.'
        : `Couldn't save: ${e.message}`;
    }
  },

  // ---- Size tool: scale (1 = auto-fit size) and x/y nudges in screen pixels, applied in Sprites.draw ----
  setTweak(key, prop, value) {
    const tw = Sprites.tweaks[key] || (Sprites.tweaks[key] = { scale: 1, x: 0, y: 0 });
    tw[prop] = value;
    if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
  },
  writeTweaks() {
    const keep = Object.fromEntries(Object.entries(Sprites.tweaks).filter(([, t]) => Object.entries(t).some(([k, v]) => !isDefaultTweak(k, v))));
    try { localStorage.setItem(DEV_TWEAK_TIME_KEY, String(Date.now())); } catch (e) {}
    try {
      if (Object.keys(keep).length) localStorage.setItem(DEV_TWEAK_KEY, JSON.stringify(keep));
      else localStorage.removeItem(DEV_TWEAK_KEY);
    } catch (e) {}
  },
  resetColor(key) {
    const t = Sprites.tweaks[key];
    if (t) { delete t.hue; delete t.sat; delete t.bright; }
    if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
    this.writeTweaks(); this.refresh(key);
  },
  resetTweak(key) {                       // size, position and rig lines (color is kept; it has its own reset)
    const t = Sprites.tweaks[key], keepColor = t && { hue: t.hue, sat: t.sat, bright: t.bright };
    delete Sprites.tweaks[key];
    if (keepColor && Object.values(keepColor).some(v => v != null)) Sprites.tweaks[key] = Object.fromEntries(Object.entries(keepColor).filter(([, v]) => v != null));
    if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
    this.writeTweaks(); this.refresh(key);
  },
  refreshDither() {
    const u = this.ditherUI; if (!u) return;
    const s = DitherFX.settings();
    u.on.checked = !!s.on;
    for (const k of ["colors", "method", "downscale"]) u[k].value = String(s[k]);
    u.gray.checked = !!s.gray; u.serpentine.checked = !!s.serpentine;
  },
  // ---- Cook rigs group: sync the controls to the chosen cook and body part ----
  refreshRig() {
    const ui = this.rigUI; if (!ui) return;
    const rig = COOK_RIGS[ui.rig], c = Sprites.tweaks[`rig:${ui.rig}`] || {}, p = { ...rig.base, ...(c.p || {}) };
    ui.rigSel.value = ui.rig; ui.roleSel.value = ui.role; ui.poseSel.value = ui.pose;
    for (const [k, s] of Object.entries(ui.params)) { const v = s.toS(p[k]); s.inp.value = v; s.out.textContent = s.fmt(v); }
    ui.shoulders.checked = !!p.shoulders;
    const a = { ...RIG_NO_ADJ, ...((c.r || {})[ui.role] || {}) };
    for (const [k, s] of Object.entries(ui.adj)) { const v = s.toS(a[k]); s.inp.value = v; s.out.textContent = s.fmt(v); }
    const key = rig.partKey(ui.role), mine = Sprites.custom[key], proj = Sprites.project[key];
    ui.status.textContent = a.noUpload ? 'From the parts sheet (uploaded image switched off)'
      : mine ? 'Your uploaded image (saved in this browser)' : proj ? 'Your uploaded image (from project files)' : 'From the parts sheet';
    ui.status.className = `dev-status ${(mine || proj) && !a.noUpload ? 'ok' : ''}`;
    ui.useSheet.disabled = !(mine || (proj && !a.noUpload));
    if (!rig.ready) { ui.mirror.checked = false; return; }
    const R = rig.role(ui.role); ui.mirror.checked = R.flip;
    const g = ui.thumb.getContext('2d'), pc = rig.pieces[R.name], s = Math.min(48 / pc.w, 48 / pc.h);   // thumbnail of the piece
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 52, 52);
    g.translate(26, 26); if (R.flip) g.scale(-1, 1);
    g.drawImage(pc.canvas, pc.x0, pc.y0, pc.w, pc.h, -pc.w * s / 2, -pc.h * s / 2, pc.w * s, pc.h * s);
  },
  // Upload an image for the chosen body part (stored like any custom sprite, key rig_<cook>_<part>).
  async uploadRigPart(file) {
    const ui = this.rigUI; if (!file || !ui) return;
    if (!/^image\/(png|webp|gif|jpeg)$/.test(file.type)) { ui.status.textContent = 'Choose a PNG (or WebP/JPEG) image.'; ui.status.className = 'dev-status err'; return; }
    const rig = COOK_RIGS[ui.rig], key = rig.partKey(ui.role);
    ui.status.textContent = 'Loading…'; ui.status.className = 'dev-status';
    try {
      let { url, img } = await shrinkDataURL(await readAsDataURL(file));
      const cut = await cleanupSprite(img); if (cut) ({ url, img } = cut);   // white background removed, margins trimmed
      this.install(key, img, url); this.saved[key] = url;
      const c = Sprites.tweaks[`rig:${ui.rig}`]; if (c && c.r && c.r[ui.role]) delete c.r[ui.role].noUpload;

      if (!this.writeStore()) { delete this.saved[key]; this.writeStore(); }
      this.refreshRig();
      if (!this.saved[key]) { ui.status.textContent = 'Loaded, but browser storage is full, so it resets on reload. Use Save to project.'; ui.status.className = 'dev-status err'; }

  },
  // Chaos debug readout (called every frame while the panel is open).
  tickChaos() {
    const r = this.chaosReadout; if (!r || !r.group.open) return;
    const w = Game.world; if (!w || !w.suspicion) { r.el.textContent = 'No shift running.'; return; }
    const pers = {}; for (const c of w.customers.list) if (c.present) pers[c.personaKey] = (pers[c.personaKey] || 0) + 1;
    r.el.textContent = [
      `Suspicion ${w.suspicion.value.toFixed(1)} (${w.suspicion.label})   Stress ${w.stress.value.toFixed(0)}`,
      `Chaos ${w.chaos.value.toFixed(0)} ${w.chaos.level.toUpperCase()}   allowance ${w.director.allowance().toFixed(1)}${w.time < w.director.recoverUntil ? '  RECOVERY' : ''}`,
      `Fog ${w.memory.active ? 'ON ' + (w.memory.until - w.time).toFixed(1) + 's' : 'off (ready in ' + Math.max(0, w.memory.cool - w.time).toFixed(0) + 's)'}`,
      `Gear ${w.stations.filter(s => s.state !== 'locked').map(s => s.def.name + ':' + Math.round(s.wear) + (s.broken ? 'X' : '')).join(' ')}`,
      `Bathroom line ${w.bathroom.line.length} ${w.bathroom.occupant ? 'occupied' : 'free'} ${Object.keys(w.bathroom.problems).join(',')}`,
      `Messes ${w.messes.length}  critters ${w.critters.length}  bags ${w.bags.length}`,
      `Customers ${Object.entries(pers).map(([k, v]) => k + ':' + v).join(' ') || '-'}`,
      `Events: ${w.director.log.slice(-4).join(', ') || '-'}`,
    ].join('\n');
  },
  // Live preview of the chosen cook (called every frame while the panel is open).
  tickRig(t) {
    const ui = this.rigUI; if (!ui || !ui.group.open) return;
    const rig = COOK_RIGS[ui.rig], c = ui.canvas, g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.strokeStyle = 'rgba(224,166,74,0.35)'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(10, c.height - 22); g.lineTo(c.width - 10, c.height - 22); g.stroke(); g.setLineDash([]);
    if (!rig.ready) return;
    const P = ui.pose, a = t % 1.4, action = /grab/i.test(P) && a < 0.38 ? { t: a, dur: 0.38 } : null;
    const view = P === 'side' || P === 'sideL' || P === 'sideGrab' ? 'side' : P === 'back' ? 'back' : 'front';
    const moving = ['frontWalk', 'side', 'sideL', 'back'].includes(P);
    rig.draw(g, c.width / 2, c.height - 22, { t, moving, view, facing: P === 'sideL' ? -1 : 1, action, height: c.height - 60 });
    if (ui.thumbFor !== rig.ready + ui.rig + ui.role) { ui.thumbFor = rig.ready + ui.rig + ui.role; this.refreshRig(); }   // first draw after the sheet loads
  },
  refreshLayout(id) {
    const s = this.layoutRows && this.layoutRows[id]; if (!s) return;
    const t = Sprites.tweaks[`layout:${id}`] || {};
    for (const [prop, sl] of Object.entries(s)) { const v = t[prop] ?? 0; sl.inp.value = v; sl.out.textContent = sl.fmt(v); }
  },

  reset(key) {
    delete Sprites.custom[key]; delete this.saved[key]; delete Sprites.tweaks[key];
    if (STATIC_KEYS.has(key)) StaticLayer.invalidate();
    this.writeStore(); this.writeTweaks();
    this.setStatus(key, 'Default art');
    this.refresh(key);
  },
  resetAll() {
    for (const L of UI_LAYOUT) { delete Sprites.tweaks[`layout:${L.id}`]; this.refreshLayout(L.id); }
    for (const { key } of DEV_ASSETS) { delete Sprites.custom[key]; delete Sprites.tweaks[key]; this.setStatus(key, 'Default art'); this.refresh(key); }
    for (const key of Object.keys(Sprites.custom)) if (key.startsWith("rig_")) delete Sprites.custom[key];   // cook-rig parts and settings
    for (const key of Object.keys(Sprites.tweaks)) if (key.startsWith("rig:")) delete Sprites.tweaks[key];
    this.refreshRig();
    this.saved = {};
    StaticLayer.invalidate();
    try { localStorage.removeItem(DEV_STORAGE_KEY); localStorage.removeItem(DEV_TWEAK_KEY); } catch (e) {}
    this.foot.note.textContent = 'All custom sprites and sizes cleared.';
  },

  toggle(force) {
    this.isOpen = force ?? !this.isOpen;
    this.panel.classList.toggle('open', this.isOpen);
    this.panel.setAttribute('aria-hidden', String(!this.isOpen));
    this.panel.inert = !this.isOpen;
    if (this.isOpen) { this.lastFocus = document.activeElement; this.closeBtn.focus(); }
    else if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus();
  },

  setStatus(key, msg, tone = '') {
    const r = this.rows[key]; if (!r) return;
    r.status.textContent = msg; r.status.className = `dev-status ${tone}`;
  },
  refresh(key) {
    const r = this.rows[key], custom = Sprites.custom[key], shown = custom || Sprites.project[key];
    r.thumb.replaceChildren();
    if (shown) { const im = document.createElement('img'); im.src = shown.def.src; im.alt = `${key} sprite`; r.thumb.append(im); }
    else { const s = document.createElement('span'); s.textContent = 'default'; r.thumb.append(s); }
    if (!custom && Sprites.project[key] && /^(Default art|Custom sprite)/.test(r.status.textContent)) this.setStatus(key, 'From project files', 'ok');
    r.reset.disabled = !custom;
    // size tool applies to uploaded or project images; sync the sliders to the saved values
    r.size.hidden = !shown || r.kind === 'ui';   // interface images always fill their box
    const tw = Sprites.tweaks[key] || { scale: 1, x: 0, y: 0 };
    for (const [prop, s] of Object.entries(r.sliders)) {
      const v = prop in RAW_TWEAKS ? (tw[prop] ?? RAW_TWEAKS[prop])
              : Math.round((tw[prop] ?? (prop === "scale" ? 1 : RIG_DEFAULTS[prop])) * 1000) / 10;
      s.inp.value = v; s.out.textContent = s.fmt(v);
    }
    const kb = Math.round(JSON.stringify(this.saved).length / 1024);
    this.foot.note.textContent = `Saved in this browser: ${kb} KB (about 5 MB available).`;
  },

  build() {
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

      info.append(el("div", "dev-name", a.label), el("div", "dev-note", a.hint), status, actions, size, color);

    // ---- interface layout: move / rotate each in-game panel (saved like any other setting) ----

      box.append(readout); this.chaosReadout = { el: readout, group: dg };
      const W = () => (Game.sm.name === 'play' || Game.sm.name === 'pause') && Game.world ? Game.world : null;

                       ['Weirdo', w => spawnAs(w, 'weirdo')], ['Indecisive', w => spawnAs(w, 'indecisive')], ['All angry', w => { for (const c of w.customers.list) if (c.present) c.patience = c.maxPatience * 0.2; }]]],
        ['Bathroom', [['Clog toilet', w => w.bathroom.addProblem('clogged', '*glorp*')], ['Overflow', w => w.bathroom.overflow()], ['Make dirty', w => w.bathroom.addProblem('dirty')],

    }
    // ---- cook rigs: cutout-animation editor (upload body parts, nudge them, tune the body; live preview) ----
    {   // own block: its helper names stay local

      const wrap = el('label', 'dev-slider'), inp = el('input'), out = el('output');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;

    ui.rigSel = pick('Cook', Object.keys(COOK_RIGS).map(id => [id, (COOKS.find(c => c.rig === id) || { name: id }).name]), v => { ui.rig = v; this.refreshRig(); });
    ui.poseSel = pick('Preview', [['front', 'Standing (front)'], ['frontWalk', 'Walking toward you'], ['side', 'Walking right'], ['sideL', 'Walking left'],
                                  ['back', 'Walking away'], ['grab', 'Grab (front)'], ['sideGrab', 'Grab (side)']], v => { ui.pose = v; });
    const pv = el('canvas', 'dev-preview'); pv.width = 280; pv.height = 320; pv.style.width = '100%'; pv.style.height = 'auto';
    pv.setAttribute('aria-label', 'Cook rig animation preview'); ui.canvas = pv; rb.append(pv);

    // body-wide settings
    const body = el('details', 'dev-size'); body.append(el('summary', null, 'Whole body'));
    const pct = v => `${v}%`, deg = v => `${v}°`, px = v => `${v}px`;
    const setP = (k, v) => { const c = cfg(); c.p = { ...(c.p || {}), [k]: v }; };
    const P = [   // [param, label, min, max, slider -> value, value -> slider, format]
      ['size', 'Size', 40, 200, v => v / 100, v => Math.round(v * 100), pct],
      ['armScale', 'Arm length', 40, 140, v => v / 100, v => Math.round(v * 100), pct],
      ['armSpread', 'Arm spread', -10, 70, v => v * Math.PI / 180, v => Math.round(v * 180 / Math.PI), deg],
      ['shoulderX', 'Shoulder width', 10, 80, v => v / 100, v => Math.round(v * 100), pct],
      ['hipX', 'Hip width', 0, 90, v => v, v => Math.round(v), px],
      ['legSplay', 'Leg splay', -15, 35, v => v * Math.PI / 180, v => Math.round(v * 180 / Math.PI), deg],
      ['hemCover', 'Leg tuck', 0, 90, v => v / 100, v => Math.round(v * 100), pct],
    ];
    for (const [k, label, min, max, toV, toS, fmt] of P) ui.params[k] = { ...range(label, min, max, 1, fmt, s => setP(k, toV(s)), body), toS };
    ui.shoulders = check('Shoulders', v => setP('shoulders', v), body);
    body.append(el('div', 'dev-note', 'Shoulders draws rounded shoulder caps, for bodies drawn without arms. Leg tuck is how far the legs go up under the body.'));
    const resetBody = el('button', 'dev-btn', 'Reset whole body'); resetBody.type = 'button';
    resetBody.addEventListener('click', () => { delete cfg().p; this.writeTweaks(); this.refreshRig(); });
    body.append(resetBody); rb.append(body);

    // one body part at a time
    const part = el('details', 'dev-size'); part.open = true; part.append(el('summary', null, 'Body part'));
    ui.roleSel = pick('Part', RIG_ROLES, v => {
      ui.role = v;   // jump the preview to a pose that shows this part
      ui.pose = /Side/.test(v) ? 'side' : /Back/.test(v) ? 'back' : ui.pose === 'side' || ui.pose === 'back' || ui.pose === 'sideL' ? 'front' : ui.pose;
      ui.poseSel.value = ui.pose; this.refreshRig();
    }, part);
    const prow = el('div', 'dev-row'); prow.style.borderBottom = '0';
    ui.thumb = el('canvas'); ui.thumb.width = ui.thumb.height = 52;
    const tbox = el('div', 'dev-thumb'); tbox.append(ui.thumb);
    const pinfo = el('div', 'dev-info'); ui.status = el('div', 'dev-status', 'From the parts sheet');
    const pacts = el('div', 'dev-actions');
    const upl = el('label', 'dev-btn dev-file', 'Upload image…'), fin = el('input');
    fin.type = 'file'; fin.accept = 'image/png,image/webp,image/gif,image/jpeg'; fin.setAttribute('aria-label', 'Upload an image for this body part');
    fin.addEventListener('change', () => { this.uploadRigPart(fin.files[0]); fin.value = ''; });
    upl.append(fin);
    ui.useSheet = el('button', 'dev-btn', 'Use sheet art'); ui.useSheet.type = 'button';
    ui.useSheet.addEventListener('click', () => {
      const key = rigOf().partKey(ui.role);
      delete Sprites.custom[key]; delete this.saved[key]; this.writeStore();
      if (Sprites.project[key]) { const c = cfg(); c.r = c.r || {}; c.r[ui.role] = { ...(c.r[ui.role] || {}), noUpload: true }; this.writeTweaks(); }
      this.refreshRig();
    });
    pacts.append(upl, ui.useSheet); pinfo.append(ui.status, pacts); prow.append(tbox, pinfo); part.append(prow);
    const setA = (k, v) => { const c = cfg(); c.r = c.r || {}; c.r[ui.role] = { ...(c.r[ui.role] || {}), [k]: v }; };
    const signed = v => `${v > 0 ? '+' : ''}${v}`;
    ui.adj = {
      dx:    { ...range('Left / right', -150, 150, 1, signed, v => setA('dx', v), part), toS: v => v },
      dy:    { ...range('Up / down', -150, 150, 1, v => signed(-v), v => setA('dy', -v), part), toS: v => -v },
      rot:   { ...range('Rotate', -180, 180, 1, deg, v => setA('rot', v * Math.PI / 180), part), toS: v => Math.round(v * 180 / Math.PI) },
      scale: { ...range('Size', 25, 250, 1, pct, v => setA('scale', v / 100), part), toS: v => Math.round(v * 100) },
    };
    ui.mirror = check('Mirror', v => { setA('flip', v); this.refreshRig(); }, part);
    part.append(el('div', 'dev-note', 'Moves are in sheet pixels (the whole cook is about 700 tall). Rotate turns a limb at its joint (shoulder, hip, ankle). An uploaded image hangs from the middle of its top edge, like the sheet pieces.'));
    const resetPart = el('button', 'dev-btn', 'Reset this part'); resetPart.type = 'button';
    resetPart.addEventListener('click', () => { const c = cfg(); if (c.r) delete c.r[ui.role]; this.writeTweaks(); this.refreshRig(); });
    part.append(resetPart); rb.append(part);
    const resetRig = el('button', 'dev-btn', 'Reset everything for this cook'); resetRig.type = 'button';
    resetRig.addEventListener('click', () => {
      delete Sprites.tweaks[`rig:${ui.rig}`];
      for (const [r] of RIG_ROLES) { const key = rigOf().partKey(r); delete Sprites.custom[key]; delete this.saved[key]; }
      this.writeStore(); this.writeTweaks(); this.refreshRig();
    });
    rb.append(resetRig);
    rg.append(rb); list.append(rg);
    }
    const foot = el('div', 'dev-foot');
    const save = el('button', 'dev-btn dev-save', 'Save to project'); save.type = 'button';
    save.addEventListener('click', () => this.saveToProject());
    foot.append(save, el('div', 'dev-note', 'Writes your images and sizes into cook-dash/assets/ so they load everywhere.'));
    const resetAll = el('button', 'dev-btn', 'Reset to Default'); resetAll.type = 'button';
    resetAll.addEventListener('click', () => this.resetAll());
    const note = el('div', 'dev-note');
    foot.append(resetAll, note);
    this.foot = { note };

    panel.append(head, list, foot);
    // Keep game shortcuts (P, M, F, digits) from firing while you use the panel.
    panel.addEventListener('keydown', e => { if (e.key === 'Escape') { this.toggle(false); } if (e.key !== '`' && e.key !== '~') e.stopPropagation(); });
    panel.addEventListener('pointerdown', e => e.stopPropagation());
    document.body.append(panel);
    this.panel = panel;
    for (const { key } of DEV_ASSETS) this.refresh(key);
  },
};

/* ============================== 14. BOOT / MAIN LOOP ======================= */
const Game = {
  canvas: null, ctx: null, sm: new StateMachine(), world: null, scale: 1,
  mouse: { x: -1, y: -1 }, keys: new Set(),
  session: null,
  newCampaign() { this.session = { bank: 0, upgrades: {}, results: [], cook: COOKS[0].id, seenCutscenes: {} }; },
};

function resize() {
  const s = Math.min(innerWidth / VIEW.W, innerHeight / VIEW.H), dpr = window.devicePixelRatio || 1;
  const c = Game.canvas;
  c.style.width = `${Math.floor(VIEW.W * s)}px`; c.style.height = `${Math.floor(VIEW.H * s)}px`;
  c.width = Math.round(VIEW.W * s * dpr); c.height = Math.round(VIEW.H * s * dpr);
  Game.scale = s * dpr;
}
function toCanvas(e) {
  const r = Game.canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * VIEW.W / r.width, y: (e.clientY - r.top) * VIEW.H / r.height };
}

function boot() {
  Game.canvas = document.getElementById('game');
  Game.ctx = Game.canvas.getContext('2d');
  Game.newCampaign();
  Sprites.load(); Object.values(COOK_RIGS).forEach(r => r.load()); AudioManager.init();
  Game.sm.add('title', TitleState).add('intro', LevelIntroState).add('play', PlayState)
         .add('pause', PauseState).add('levelEnd', LevelEndState).add('shop', ShopState).add('victory', VictoryState)
         .add('cookSelect', CookSelectState).add("cutscene", CutsceneState);
  resize(); addEventListener('resize', resize);
  // Left click acts; right/middle drag (or Space + left drag) pans the camera during a shift.
  const cvs = Game.canvas;
  cvs.addEventListener('pointermove', e => {
    const p = toCanvas(e);
    if (Camera.drag) { Camera.pan(p.x - Game.mouse.x, p.y - Game.mouse.y); Camera.drag.moved = true; }
    Game.mouse = p;
  });
  cvs.addEventListener('pointerdown', e => {
    AudioManager.unlock();
    const p = toCanvas(e); Game.mouse = p;
    const inPlay = Game.sm.name === 'play';
    if (inPlay && (e.button === 1 || e.button === 2 || (e.button === 0 && Game.keys.has(' ')))) {
      Camera.drag = { moved: false }; cvs.setPointerCapture(e.pointerId); e.preventDefault(); return;
    }
    if (e.button === 0) Game.sm.click(p.x, p.y);
  });
  const endDrag = () => { Camera.drag = null; };
  cvs.addEventListener('pointerup', endDrag); cvs.addEventListener('pointercancel', endDrag);
  cvs.addEventListener('contextmenu', e => e.preventDefault());
  cvs.addEventListener('wheel', e => {
    if (Game.sm.name !== 'play') return;
    e.preventDefault();
    const p = toCanvas(e);
    Camera.zoomAt(p.x, p.y, Math.exp(clamp(-e.deltaY, -120, 120) * (e.ctrlKey ? 0.01 : 0.0018)));   // ctrlKey = trackpad pinch
  }, { passive: false });
  const keyName = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
  addEventListener('keyup', e => Game.keys.delete(keyName(e)));
  addEventListener('blur', () => Game.keys.clear());
  loadCustomFont();
  DitherFX.init();
  DevAssets.init();
  loadProjectAssets();
  addEventListener('keydown', e => {
    if (e.key === '`' || e.key === '~' || e.code === 'Backquote') { e.preventDefault(); DevAssets.toggle(); return; }
    Game.keys.add(keyName(e));
    if (Game.sm.name === 'play' && (e.key === ' ' || e.key.startsWith('Arrow'))) e.preventDefault();   // no page scrolling
    if (e.key === 'm' || e.key === 'M') AudioManager.toggleMute();
    if (e.key === "f" || e.key === "F") { DitherFX.set("on", !DitherFX.settings().on); DevAssets.writeTweaks(); DevAssets.refreshDither(); }   // dithering on/off
    Game.sm.key(e.key);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.sm.name === 'play') Game.sm.change('pause'); });
  Game.sm.change('title');
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    Game.sm.update(dt);
    const ctx = Game.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#110e17"; ctx.fillRect(0, 0, Game.canvas.width, Game.canvas.height);   // no stale pixels between frames
    ctx.setTransform(Game.scale, 0, 0, Game.scale, 0, 0); ctx.imageSmoothingQuality = 'high';
    Game.sm.render(ctx);
    PostFX.apply(ctx);   // gritty retro finish over the whole frame, HUD included
    DitherFX.render();   // RetroDither: adaptive palette + error diffusion over the finished frame
    if (DevAssets.isOpen) { DevAssets.tickPreviews(now / 1000); DevAssets.tickRig(now / 1000); DevAssets.tickChaos(); }
    requestAnimationFrame(frame);
  })(last);
}
boot();
</script>
