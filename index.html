// All cut lines are per-sprite sliders in the dev panel ("Adjust size"); defaults fit the player art.
// Sprite sheets with frames > 1 play their own frames instead.
const WALK = {
  speed: 10,      // cycle speed in radians/second (one cycle = two steps)
  bounce: 3.5,    // px the figure hops between footfalls
  rock: 0.06,     // upper-body sway, radians
  swing: 0.22,    // leg shear: feet move forward/back by swing × leg height
  lift: 0.16,     // fraction of leg height a stepping foot rises
  squash: 0.045,  // squash/stretch when a foot lands
  armSwing: 0.12, // arm swing while walking, radians
};
// Default rig lines, as fractions of the (trimmed) image: hip/shoulder/hand from the top,
// armX = width of each arm strip from the side (0 turns arms off), eye position and radius (0 = no twitch).
// legX = where the left and right leg halves split, from the left edge (move it into the gap between the legs).
const RIG_DEFAULTS = { hip: 0.6, legX: 0.5, shoulder: 0.38, hand: 0.82, armX: 0.24, eyeX: 0.53, eyeY: 0.27, eyeR: 0.04 };
// Grab / place reach: right = leading arm, left = trailing arm (radians), lean (radians), dip (px).
const ACTIONS = {
  grab:  { dur: 0.38, right: 1.05, left: 0.3, lean: 0.07, dip: 2 },
  place: { dur: 0.38, right: 0.65, left: 0.2, lean: 0.11, dip: 4.5 },
  // customer gets their order: both arms thrown up and two quick hops (jump = hop height in px)
  cheer: { dur: 1.1, right: 1.35, left: 1.35, lean: 0, dip: 0, jump: 16, hops: 2 },
};
const rigParam = (tw, def, k) => tw[k] ?? def[k] ?? RIG_DEFAULTS[k];

// Cuts the arm strips out of the image (cached until the image or the cut lines change).
const RigCache = new Map();
function getRig(key, img, tw, def) {
  const p = { armX: clamp(rigParam(tw, def, 'armX'), 0, 0.45), shoulder: rigParam(tw, def, 'shoulder'), hand: rigParam(tw, def, 'hand'),
              eyeX: rigParam(tw, def, 'eyeX'), eyeY: rigParam(tw, def, 'eyeY'), eyeR: rigParam(tw, def, 'eyeR') };
  const sig = `${imgId(img)}:${img.width}x${img.height}:${p.armX}:${p.shoulder}:${p.hand}:${p.eyeX}:${p.eyeY}:${p.eyeR}`;
  const hit = RigCache.get(key);
  if (hit && hit.img === img && hit.sig === sig) return hit;
  const iw = img.width, ih = img.height, rig = { img, sig, ...p, core: img, armL: null, armR: null, lid: null };
  const top = Math.round(ih * Math.min(p.shoulder, p.hand)), bot = Math.round(ih * Math.max(p.shoulder, p.hand)), aw = Math.round(iw * p.armX);
  if (aw > 1 && bot - top > 1) {
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const core = mk(iw, ih), cg = core.getContext('2d');
    cg.drawImage(img, 0, 0); cg.clearRect(0, top, aw, bot - top); cg.clearRect(iw - aw, top, aw, bot - top);
    const armL = mk(aw, bot - top), armR = mk(aw, bot - top);
    armL.getContext('2d').drawImage(img, 0, top, aw, bot - top, 0, 0, aw, bot - top);
    armR.getContext('2d').drawImage(img, iw - aw, top, aw, bot - top, 0, 0, aw, bot - top);
    Object.assign(rig, { core, armL, armR, top: top / ih, bot: bot / ih, aw: aw / iw });
  }
  if (p.eyeR > 0) {                 // eyelid color = skin around the eye (lightest sample that isn't ink or eye-white)
    rig.lid = '#c9a07a';
    try {
      const c = document.createElement('canvas'); c.width = c.height = 1;
      const g = c.getContext('2d', { willReadFrequently: true });
      let best = -1;
      for (const [ox, oy] of [[1.8, 0], [-1.8, 0], [0, 2.3], [1.4, 1.6], [-1.4, 1.6], [0, -2.2]]) {
        const sx = clamp((p.eyeX + ox * p.eyeR) * iw, 0, iw - 1), sy = clamp(p.eyeY * ih + oy * p.eyeR * iw, 0, ih - 1);
        g.clearRect(0, 0, 1, 1); g.drawImage(img, sx, sy, 1, 1, 0, 0, 1, 1);
        const [r, gr, b, a] = g.getImageData(0, 0, 1, 1).data, lum = 0.3 * r + 0.59 * gr + 0.11 * b;
        if (a > 60 && lum > 70 && lum < 225 && lum > best) { best = lum; rig.lid = `rgb(${r},${gr},${b})`; }
      }
    } catch (e) {}
  }
  RigCache.set(key, rig);
  return rig;
}
// 0..1 eyelid closure: a quick double flutter every few seconds, offset per character.
function eyeTwitch(t, phase) {
  const period = 3.2 + (Math.abs(phase) % 2.3), u = (t + phase * 0.37) % period;
  if (u < 0.12) return Math.sin(Math.PI * u / 0.12);
  if (u > 0.18 && u < 0.28) return 0.65 * Math.sin(Math.PI * (u - 0.18) / 0.1);
  return 0;
}

// Settings for a sprite. An "_angry" variant inherits every setting it doesn't set itself (size, rig lines)
// from its normal sprite, setting by setting, so a half-configured angry pose never falls back to generic defaults.
function spriteTweaks(key) {
  const own = Sprites.tweaks[key] || {};
  if (!key.endsWith('_angry')) return own;
  return { ...(Sprites.tweaks[key.slice(0, -6)] || {}), ...own };
}
// angry: trembling, quicker stompy walk, little stomps and arm flailing while standing (see ANGRY).
const ANGRY = { at: 0.3, walkSpeed: 1.35, tremble: 1.1, stomp: 4, flail: 0.18, sway: 0.04 };
function drawCharacterSprite(ctx, key, x, y, { t = 0, moving = false, facing = 1, fitH = 76, phase = 0, shadow = true, action = null, angry = false } = {}) {
  const { def, img: rawImg } = Sprites.entry(key);
  const img = tintedImg(key, rawImg);
  if ((def.frames || 1) > 1) {
    Sprites.draw(ctx, key, x, y, { t, flip: facing < 0, frame: moving ? null : 0, fitH });
    return { x: x - 20, y: y - fitH, w: 40, h: fitH };
  }
  const tw = spriteTweaks(key);
  const rig = getRig(key, img, tw, def), src = rig.core;
  const scale = (def.autoFit ? fitH / img.height : 1) * (tw.scale ?? 1);
  const W = img.width * scale, H = img.height * scale;
  const hip = clamp(rigParam(tw, def, 'hip'), 0.2, 0.95);
  const sHip = img.height * hip, legH = H * (1 - hip), bodyH = H * hip;
  const ph = t * WALK.speed * (angry ? ANGRY.walkSpeed : 1) + phase, s = Math.sin(ph), c = Math.cos(ph);
  // grab/place: k rises 0→1→0 over the action
  const A = action && ACTIONS[action.type], u = A ? clamp(action.t / A.dur, 0, 1) : 0, k = A ? Math.sin(Math.PI * u) : 0;
  const jump = A && A.jump ? Math.abs(Math.sin(Math.PI * (A.hops || 1) * u)) * A.jump : 0;   // hops for cheer
  const fuming = angry && !moving && !A;
  const stomp = fuming && !REDUCED_MOTION ? Math.pow(Math.max(0, Math.sin(t * 5.5 + phase)), 10) * ANGRY.stomp : 0;
  const bob = (moving ? (1 - Math.abs(s)) * WALK.bounce : 0) - (A ? A.dip * k : 0) + jump + stomp;
  const sq = moving ? Math.pow(Math.abs(s), 4) * WALK.squash
           : Math.sin(t * 2.4 + phase) * 0.012 + (A ? (A.jump ? -0.05 * jump / A.jump : 0.03 * k) : 0);   // stretch in the air
  const rock = (moving ? s * WALK.rock * (angry ? 1.5 : 1) : 0) + (A ? A.lean * k : 0) + (fuming ? Math.sin(t * 9 + phase) * ANGRY.sway : 0);
  const shake = angry && !REDUCED_MOTION ? Math.sin(t * 61 + phase * 3) * ANGRY.tremble : 0;
  const ox = x + (tw.x || 0) + shake, oy = y - (tw.y || 0);
  ctx.save(); ctx.translate(ox, oy);
  if (shadow) ellipse(ctx, 0, 0, Math.max(10, W * 0.3) * (1 - Math.max(0, bob) / 30), 5, 'rgba(0,0,0,0.3)');
  if (facing < 0) ctx.scale(-1, 1);
  ctx.translate(0, -bob);
  for (const side of [-1, 1]) {                                                  // legs: left half, right half
    const fwd = moving ? s * side : 0;
    const lift = moving ? Math.max(0, c * side) * WALK.lift : 0;                 // the leg swinging forward is in the air
    ctx.save(); ctx.translate(0, -legH); ctx.transform(1, 0, fwd * WALK.swing, 1, 0, 0);
    const split = img.width * clamp(rigParam(tw, def, 'legX'), 0.1, 0.9);       // each leg (and its shoe) stays whole
    const sx = side < 0 ? 0 : split - 1, sw = side < 0 ? split + 1 : img.width - sx;
    ctx.drawImage(src, sx, sHip, sw, img.height - sHip, -W / 2 + sx * scale, 0, sw * scale, legH * (1 - lift));
    ctx.restore();
  }
  const ov = Math.min(img.height - sHip, img.height * 0.06);                    // body overlaps the legs to hide the seam
  ctx.save(); ctx.translate(0, -legH); ctx.rotate(rock); ctx.scale(1 + sq, 1 - sq);
  ctx.drawImage(src, 0, 0, img.width, sHip + ov, -W / 2, -bodyH, W, bodyH + ov * scale);
  // body-local coordinates: x across the image centered on 0, y = image row × scale − bodyH
  const ly = f => f * H - bodyH;
  if (rig.eyeR > 0) {                                                            // eye twitch
    const lid = eyeTwitch(t, phase);
    if (lid > 0.02) {
      const ex = rig.eyeX * W - W / 2, ey = ly(rig.eyeY), er = rig.eyeR * W;
      ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, er * 1.15, er * 1.05, 0, 0, Math.PI * 2); ctx.clip();
      const lidY = ey - er * 1.1 + lid * er * 2.2;
      ctx.fillStyle = rig.lid; ctx.fillRect(ex - er * 1.3, ey - er * 1.3, er * 2.6, lidY - (ey - er * 1.3));
      ctx.beginPath(); ctx.moveTo(ex - er * 1.2, lidY); ctx.quadraticCurveTo(ex, lidY + er * 0.35, ex + er * 1.2, lidY);
      ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, er * 0.22); ctx.stroke();
      ctx.restore();
    }
  }
  if (rig.armL) {                                                                // arms rotate at the shoulders
    const aw = rig.aw * W, ah = (rig.bot - rig.top) * H, shY = ly(rig.top);
    const swing = moving ? s * WALK.armSwing * (angry ? 1.6 : 1) : fuming ? Math.sin(t * 9 + phase) * ANGRY.flail : 0;
    const angL = swing + (A ? A.left * k : 0);                                   // + lifts the left arm outward
    const angR = swing - (A ? A.right * k : 0);                                  // − lifts the right (leading) arm
    // underlay: the unmoved shoulder/armpit part of each strip fills the wedge a raised arm opens up
    const sw = rig.armL.width, shh = rig.armL.height, uw = 0.4, uh = 0.45;
    ctx.drawImage(rig.armL, sw * (1 - uw), 0, sw * uw, shh * uh, -W / 2 + aw * (1 - uw), shY, aw * uw, ah * uh);
    ctx.drawImage(rig.armR, 0, 0, sw * uw, shh * uh, W / 2 - aw, shY, aw * uw, ah * uh);
    ctx.save(); ctx.translate(-W / 2 + aw, shY); ctx.rotate(angL); ctx.drawImage(rig.armL, -aw, 0, aw, ah); ctx.restore();
    ctx.save(); ctx.translate(W / 2 - aw, shY); ctx.rotate(angR); ctx.drawImage(rig.armR, 0, 0, aw, ah); ctx.restore();
  }
  ctx.restore();
  ctx.restore();
  return { x: ox - W / 2, y: oy - H - Math.max(0, bob), w: W, h: H };
}

// Angry = patience bar in the red while still waiting on you, or storming out (not when fleeing a raid).
function customerAngry(c) {
  if (c.state === CS.STORMING) return !c.scared;
  return c.patienceFrac < ANGRY.at && [CS.ENTERING, CS.QUEUED, CS.READY_TO_ORDER, CS.WAITING].includes(c.state);
}
// Steam puffing out of an angry customer's head (built-in and uploaded art alike).
function drawSteam(ctx, c) {
  const h = c.hit; if (!h || REDUCED_MOTION) return;
  const cx = h.x + h.w / 2, top = h.y + Math.min(10, h.h * 0.08);
  for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
    const k = (c.anim * 1.4 + i / 3 + (side > 0 ? 0.5 : 0)) % 1;
    const x = cx + side * (h.w * 0.28 + k * 10), y = top - k * 22, r = 3 + k * 6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(235,235,235,${0.75 * (1 - k)})`; ctx.fill();
  }
}

function drawCustomer(ctx, c, selected) {
  const walking = c.path.length > 0, p = P(c.x, c.y);
  if (selected) {
    ctx.save(); ctx.strokeStyle = '#ffd35a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 20 + Math.sin(c.anim * 8) * 2, 9, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  // SPRITE HOOK: per-type sprite first, then the shared "customer" sprite; animated by drawCharacterSprite.
  const baseKey = useSprite(`customer_${c.typeKey}`) ? `customer_${c.typeKey}` : useSprite('customer') ? 'customer' : null;
  const angry = customerAngry(c);
  const key = baseKey && angry && useSprite(`${baseKey}_angry`) ? `${baseKey}_angry` : baseKey;   // angry art once the bar goes red
  if (key) {
    if (c.state === CS.OVERDOSED || c.state === CS.CARRIED) {                    // lying flat, same as the vector art
      const lift = c.state === CS.CARRIED ? 26 : 0;
      ellipse(ctx, p.x - 22, p.y + 2, 34, 8, 'rgba(0,0,0,0.3)');
      ctx.save(); ctx.translate(p.x, p.y - lift - 4); ctx.rotate(-Math.PI / 2); ctx.translate(-p.x, -p.y);
      drawCharacterSprite(ctx, key, p.x, p.y, { t: c.anim, fitH: 74, shadow: false });
      ctx.restore();
      c.hit = { x: p.x - 76, y: p.y - lift - 22, w: 80, h: 34 };
      return;
    }
    c.hit = drawCharacterSprite(ctx, key, p.x, p.y - seatZ(c), {
      t: c.anim, moving: walking, facing: c.facing, fitH: 74, phase: c.id * 1.7, shadow: !seatZ(c), action: c.action, angry,
    });
    return;
  }
  const look = CUSTOMER_LOOKS[c.typeKey] || {};
  const base = { ...look, body: c.type.body, pants: c.type.pants, skin: c.skin, hair: c.hair, hat: HATS[c.id % HATS.length], facing: c.facing, t: c.anim };
  if (c.state === CS.OVERDOSED || c.state === CS.CARRIED) {   // lying flat; lifted between the cops when carried
    const lift = c.state === CS.CARRIED ? 26 : 0;
    ellipse(ctx, p.x - 22, p.y + 2, 34, 8, 'rgba(0,0,0,0.3)');
    ctx.save(); ctx.translate(p.x, p.y - lift - 4); ctx.rotate(-Math.PI / 2); ctx.translate(-p.x, -p.y);
    drawCharacter(ctx, c.x, c.y, { ...base, shades: false, skin: '#a9c48a', xEyes: true, noShadow: true });
    ctx.restore();
    c.hit = { x: p.x - 66, y: p.y - lift - 20, w: 70, h: 30 };
    return;
  }
  c.hit = withColor(ctx, `customer_${c.typeKey}`, g => drawCharacter(g, c.x, c.y, {
    ...base, sitZ: seatZ(c), walking, angry: c.state === CS.STORMING && !c.scared, scared: c.state === CS.STORMING && c.scared,
    mood: [CS.LEAVING, CS.SAMPLING].includes(c.state) ? 1 : c.patienceFrac,
    ...cheerPose(c),
  }), { x: p.x - 40, y: p.y - 110, w: 80, h: 120 });
}
// Built-in art version of the cheer: hops, both arms up, big open grin; then a happy bob while sampling.
function cheerPose(c) {
  const walking = c.path.length > 0;
  if (c.action && c.action.type === 'cheer') {
    const A = ACTIONS.cheer, u = clamp(c.action.t / A.dur, 0, 1);
    return { bob: Math.abs(Math.sin(Math.PI * A.hops * u)) * A.jump, reach: Math.sin(Math.PI * u) * 1.25, cheer: true, excited: true };
  }
  return { bob: walking ? Math.abs(Math.sin(c.anim * 12)) * 2 : (c.state === CS.SAMPLING ? Math.abs(Math.sin(c.anim * 6)) * 3 : 0),
           excited: c.state === CS.SAMPLING };
}

function drawStar(ctx, x, y, r, fill) {
  if (uiSprite(ctx, 'ui_star', x - r * 1.2, y - r * 1.2, r * 2.4, r * 2.4)) return;   // SPRITE HOOK
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
}
// Ring of stars orbiting a happy customer's head (from the moment they're served until they leave).
// Uses the hit box from the last draw, so it follows the head through the cheer hops and fits any sprite size.
function drawStarHalo(ctx, c) {
  const h = c.hit; if (!h) return;
  const fresh = c.action && c.action.type === 'cheer' ? 1 - c.action.t / ACTIONS.cheer.dur : 0;   // bigger + faster right after serving
  const cx = h.x + h.w / 2, cy = h.y + Math.min(14, h.h * 0.12), rx = Math.max(18, h.w * 0.32) + fresh * 6, ry = rx * 0.32;
  const n = 5, spin = c.anim * (2.6 + fresh * 3);
  for (let i = 0; i < n; i++) {
    const a = spin + i * Math.PI * 2 / n, depth = (Math.sin(a) + 1) / 2;    // front stars are bigger and brighter
    ctx.save(); ctx.globalAlpha = 0.55 + depth * 0.45;
    drawStar(ctx, cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, 4 + depth * 3 + fresh * 2, i % 2 ? '#ffe066' : '#ffc23a');
    ctx.restore();
  }
}

function drawCustomerOverlay(ctx, c) {
  const p = P(c.x, c.y), top = p.y - seatZ(c) - 76;
  if (c.state === CS.OVERDOSED) {              // dizzy stars circling the head
    for (let i = 0; i < 3; i++) {
      const a = c.anim * 4 + i * 2.1;
      text(ctx, '✶', p.x - 46 + Math.cos(a) * 14, p.y - 16 + Math.sin(a) * 5, { size: 13, color: '#ffe066', stroke: INK, strokeW: 2 });
    }
    return;
  }
  if (c.state === CS.CARRIED) return;
  if (customerAngry(c)) drawSteam(ctx, c);
  if (c.lookalike) drawEmote(ctx, p.x - 26, top - 18, 'clipboard', 1);   // the clipboard never goes away
  if (c.arguing > 0) drawEmote(ctx, p.x + 26, top - 18, 'angry', 1);
  else if (c.state === CS.LINGER) drawEmote(ctx, p.x + 26, top - 18, 'dots', 1);
  else   if (c.emote) drawEmote(ctx, p.x + 26, top - 18, c.emote.kind, c.emote.t);
  if (![CS.LEAVING, CS.STORMING, CS.SAMPLING].includes(c.state)) drawPatienceBar(ctx, p.x, top, c.patienceFrac);
  const by = top - 6;
  if (c.state === CS.WAITING && c.waitLeft > 0) {   // too soon to serve: red bubble with a countdown
    const pulse = 1 + Math.sin(c.anim * 10) * 0.05;
    drawBubble(ctx, p.x, by, 34 * pulse, 34 * pulse, '#f6c2b6');
    drawItemIcon(ctx, c.recipe, 'packed', p.x, by - 17, 0.95);
    ellipse(ctx, p.x + 18, by - 30, 10, 10, '#c62828'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    text(ctx, `${Math.ceil(c.waitLeft)}`, p.x + 18, by - 29, { size: 12 });
    return;
  }
  if (c.state === CS.READY_TO_ORDER) {
    const s = 1 + Math.sin(c.anim * 8) * 0.08;
    drawBubble(ctx, p.x, by, 28 * s, 28 * s, '#ffd35a');
    text(ctx, '!', p.x, by - 14 * s, { size: 20, color: '#222' });
  } else if (c.state === CS.WAITING) {
    drawBubble(ctx, p.x, by, 34, 34, '#efe8d4');
    if (c.w.memory.active) drawFoggedIcon(ctx, p.x, by - 17, 0.95); else drawItemIcon(ctx, c.recipe, 'packed', p.x, by - 17, 0.95);
  } else if (c.state === CS.BROWSING) {
    drawBubble(ctx, p.x, by, 34, 22, '#efe8d4');
    text(ctx, '• • •', p.x, by - 11, { size: 11, color: '#555' });
  } else if (c.state === CS.SAMPLING) {
    drawStarHalo(ctx, c);
  } else if (c.state === CS.STORMING) {
    if (c.scared) text(ctx, 'AAH!', p.x, top - 4, { size: 15, color: '#9fd8ff', stroke: '#06223a' });
    else text(ctx, '#@!%', p.x, top - 4, { size: 15, color: '#ff6b6b', stroke: '#300' });
  }
}

// ---- Cutout rigs: cooks animated from a sheet of separate body parts ----
// Each parts sheet holds every piece once, in its own clean cell: heads (front, side, back), torsos, arms with
// hands, straight and bent-knee legs, and shoes. A rig definition says where each piece sits on the sheet
// (`parts`) and which piece plays which role (`use`). On load the rig measures each piece from its pixels (the
// neck under a head, the top and bottom of a limb, the ankle peg on a shoe) and derives the body layout (ankle,
// hip, hem, neck, shoulders) from the piece sizes, so a redrawn sheet snaps together on its own.
// Views: front (standing, or walking toward the camera), side (walking left/right; mirrored for left) and back
// (walking away). Side walk: the planted leg is straight and pushes back while the swinging leg switches to a
// bent-knee piece and comes forward; front walk: feet lift in turn. The body bobs, arms swing opposite the legs
// and the head bobbles a beat behind. Grab/place raises the working arm.
// Dev panel → "Cook rigs": any role can be swapped for an uploaded image (sprite key rig_<id>_<role>) and nudged
// (x, y, rotation, size, mirror); body-wide settings (arm length, hip width, ...) too. Those settings live in
// Sprites.tweaks["rig:<id>"] = { p: { param: value }, r: { role: { dx, dy, rot, scale, flip } } }.
const RIG_PARAMS = {   // body-wide settings and their defaults
  size: 1,           // overall size on screen
  armScale: 0.92,    // arm length relative to the art
  armSpread: 0.46,   // how far the arms hang out from the body (radians)
  hemCover: 0.34,    // how much of each leg tucks up under the torso
  hipX: 32,          // hip joints from the middle (sheet px)
  legSplay: 0.18,    // legs angle outward (radians)
  shoulderX: 0.4,    // shoulder joints from the middle (fraction of the torso width)
  shoulders: false,  // draw shoulder caps (for torsos drawn without arms)
};
const RIG_ROLES = [   // [role, label]; the preview pose that shows each one best comes from its name
  ['headFront', 'Head (front)'], ['headSide', 'Head (side)'], ['headBack', 'Head (back)'],
  ['torsoFront', 'Body (front)'], ['torsoSide', 'Body (side)'], ['torsoBack', 'Body (back)'],
  ['armFrontL', 'Left arm (front/back)'], ['armFrontR', 'Right arm (front/back)'], ['armSideNear', 'Near arm (side)'], ['armSideFar', 'Far arm (side)'],
  ['legFrontL', 'Left leg (front/back)'], ['legFrontR', 'Right leg (front/back)'],

function drawPlayerOverlay(ctx, pl, t) {
  const p = P(pl.x, pl.y), top = p.y - 104;
  if (pl.job && pl.job.dur < 900) {
    const k = clamp(pl.job.t / pl.job.dur, 0, 1), melt = pl.job.melt;
    rrect(ctx, p.x - 30, top - 6, 60, 9, 4); ctx.fillStyle = "rgba(20,14,8,0.8)"; ctx.fill();
    rrect(ctx, p.x - 29, top - 5, 58 * k, 7, 3); ctx.fillStyle = melt ? "#ff6b6b" : "#9bd36a"; ctx.fill();
    text(ctx, pl.job.label, p.x, top - 16, { size: 12, color: melt ? "#ff6b6b" : "#efe3c4", stroke: "rgba(0,0,0,0.85)" });
    if (melt && !REDUCED_MOTION) for (let i = 0; i < 3; i++) text(ctx, "@#!"[i], p.x - 22 + i * 22, top - 34 + Math.sin(t * 9 + i) * 4, { size: 14, color: "#ff8a6b", stroke: "#300" });
  }
  const st = pl.w.stress.value;
  if (st > 70 && !REDUCED_MOTION) {   // sweat drops fly off
    for (let i = 0; i < 2; i++) { const k = (t * 1.6 + i * 0.5) % 1; ctx.save(); ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.ellipse(p.x + (i ? 14 : -14) + (i ? 1 : -1) * k * 10, p.y - 88 + k * 14, 2.5, 4, 0, 0, Math.PI * 2); ctx.fillStyle = "#9fd8ff"; ctx.fill(); ctx.restore(); }
  }
}
// Suspicion tag eye (placeholder art; SPRITE HOOK icon_suspicion). Opens wider and turns red as suspicion climbs.
function drawSuspicionEye(ctx, x, y, level, t) {
  if (uiSprite(ctx, "icon_suspicion", x - 15, y - 15, 30, 30)) return;
  const open = [0.45, 0.65, 0.85, 1][level], col = ["#efe3c4", "#f2d68a", "#f2a35e", "#ff6b5a"][level];
  ctx.save(); ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.quadraticCurveTo(x, y - 14 * open, x + 14, y); ctx.quadraticCurveTo(x, y + 14 * open, x - 14, y); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke(); ctx.clip();
  const look = Math.sin(t * (0.6 + level * 0.5)) * 4;
  ctx.beginPath(); ctx.arc(x + look, y, 5.5, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill(); ctx.restore();
}
// ---- Stations, fixtures, seating ----
function drawStation(ctx, st, t) {

  st.hit = drawProp(ctx, key, st.x, st.y, { t, state: st.state, progress: st.progress, item: st.item });

}
function drawLabel(ctx, str, x, y) {

}

  const s = PROP_SHAPES[st.def.prop], c = P(st.x, st.y, s.h + 8);

    ctx.strokeStyle = '#9bd36a'; ctx.lineWidth = 4; ctx.beginPath();

    const l = { x: c.x, y: c.y - 16 };
    ctx.beginPath(); ctx.arc(l.x, l.y - 6, 5, Math.PI, 0); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = '#b9b9b0'; ctx.lineWidth = 2; ctx.stroke();
    rrect(ctx, l.x - 7, l.y - 6, 14, 11, 2); ctx.fillStyle = '#c9a640'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();

function drawFixture(ctx, f, t) { f.hit = drawProp(ctx, f.kind === 'supply' ? 'fridge' : 'trash', f.x, f.y, { t }); }
function drawFixtureOverlay(ctx, f) {}   // fridge / trash name labels removed

    line(ctx, { x: sp.x - 2, y: sp.y + 2 }, { x: sp.x + 5, y: sp.y + 4 }, '#e6e0cc', 2);

function drawCop(ctx, cop) {

// Red/blue light wash from the screen edges plus a banner. Alternates slowly (2.5 Hz) and
// holds still when the viewer prefers reduced motion.
function drawRaidFX(ctx, raid) {
  if (raid.sirens) {
    const flip = REDUCED_MOTION ? 0 : Math.floor(raid.t * 2.5) % 2;
    const [l, r] = flip ? ['60,110,255', '230,40,40'] : ['230,40,40', '60,110,255'];
    const g = ctx.createLinearGradient(0, 0, VIEW.W, 0);
    g.addColorStop(0, `rgba(${l},0.32)`); g.addColorStop(0.3, `rgba(${l},0)`);
    g.addColorStop(0.7, `rgba(${r},0)`); g.addColorStop(1, `rgba(${r},0.32)`);
    ctx.fillStyle = g; ctx.fillRect(0, 56, VIEW.W, 540);
  }
  const label = raid.busting ? "BUSTED!" : raid.state === "panic" ? "OVERDOSE!" : "POLICE RAID!";
  const s = REDUCED_MOTION ? 1 : 1 + Math.sin(raid.t * 8) * 0.04;
  ctx.save(); ctx.translate(640, 112); ctx.scale(s, s);
  rrect(ctx, -150, -24, 300, 48, 8); ctx.fillStyle = 'rgba(20,10,10,0.85)'; ctx.fill();
  ctx.strokeStyle = raid.state === 'panic' ? '#b6ff6b' : '#ff5a4a'; ctx.lineWidth = 3; ctx.stroke();
  text(ctx, label, 0, 2, { size: 30, font: DISPLAY_FONT, weight: 'normal', color: raid.state === 'panic' ? '#b6ff6b' : '#fff', stroke: '#000', strokeW: 5 });
  ctx.restore();
}

// ---- Chaos systems: drawing (placeholder art; each has a SPRITE HOOK in the dev panel "Chaos" group) ----
// Floor mess: a flat iso puddle (puddle = grey water, spill = brown goo, litter = paper trash).
function drawMess(ctx, m) {
  const p = P(m.x, m.y), rx = m.r * ISO_RX, ry = m.r * ISO_RY;
  m.hit = { x: p.x - rx, y: p.y - ry - 6, w: rx * 2, h: ry * 2 + 12 };
  if (useSprite(`mess_${m.type}`)) { Sprites.draw(ctx, `mess_${m.type}`, p.x, p.y + ry, { fitW: rx * 2.2 }); return; }   // SPRITE HOOK
  const rng = mulberry32(m.seed | 0);
  const col = { puddle: ["rgba(106,118,72,0.9)", "rgba(220,230,190,0.75)"], spill: ['rgba(92,58,28,0.85)', 'rgba(190,140,90,0.6)'], litter: ['rgba(80,70,50,0.35)', 'rgba(240,235,220,0.9)'] }[m.type];
  ctx.save(); ctx.beginPath();
  for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2, k = 0.75 + rng() * 0.35; ctx.lineTo(p.x + Math.cos(a) * rx * k, p.y + Math.sin(a) * ry * k); }
  ctx.closePath(); ctx.fillStyle = col[0]; ctx.fill(); ctx.strokeStyle = "rgba(20,15,10,0.7)"; ctx.lineWidth = 1.6; ctx.stroke();
  if (m.type === 'litter') for (let i = 0; i < 5; i++) { ctx.fillStyle = col[1]; ctx.fillRect(p.x + (rng() - 0.5) * rx * 1.4, p.y + (rng() - 0.5) * ry * 1.2, 6, 4); }
  else { ctx.beginPath(); ctx.ellipse(p.x - rx * 0.25, p.y - ry * 0.2, rx * 0.25, ry * 0.18, 0, 0, Math.PI * 2); ctx.fillStyle = col[1]; ctx.fill(); }
  ctx.restore();
}
// Bathroom door on the left wall (SPRITE HOOK bathroom_door, placed like the entrance door).

}
// Screen-space effects: flickering lights and a faint red edge at critical suspicion.
function drawChaosScreenFX(ctx, w) {
  if (w.flicker > 0 && !REDUCED_MOTION) {
    const k = Math.sin(w.time * 47) * Math.sin(w.time * 13.3) > 0.2 ? 0.55 : 0.08;
    ctx.fillStyle = `rgba(5,4,8,${k})`; ctx.fillRect(0, 0, VIEW.W, VIEW.H);
  }
  if (w.suspicion.value >= CHAOS_CONFIG.suspicion.criticalAt) {
    const a = 0.12 + (REDUCED_MOTION ? 0 : Math.sin(w.time * 4) * 0.04);
    const g = ctx.createRadialGradient(VIEW.W / 2, VIEW.H / 2, 300, VIEW.W / 2, VIEW.H / 2, 760);
    g.addColorStop(0, 'rgba(180,20,20,0)'); g.addColorStop(1, `rgba(180,20,20,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW.W, VIEW.H);
  }
}
// ---- Scene render ----
function drawWorld(ctx, w, hovered) {
  const t = w.time;
  ctx.drawImage(StaticLayer.get(Game.scale * Camera.settledZoom), ROOM_LAYER.x, ROOM_LAYER.y, ROOM_LAYER.w, ROOM_LAYER.h);
  withColor(ctx, "sign_neon", c => drawNeonSign(c, t), { x: 720, y: 120, w: 340, h: 200 });
  const list = [];
  for (const s of w.stations) list.push({ d: s.depth, f: () => drawStation(ctx, s, t), o: () => drawStationOverlay(ctx, s, t) });
  for (const f of [w.supply, w.trash]) list.push({ d: f.depth, f: () => drawFixture(ctx, f, t), o: () => drawFixtureOverlay(ctx, f) });
  for (const b of w.booths) list.push({ d: b.depth, f: () => drawBooth(ctx, b, t), o: () => drawBoothOverlay(ctx, b, t) });
  list.push({ d: w.bathroom.depth, f: () => drawBathroomDoor(ctx, w.bathroom), o: () => drawBathroomOverlay(ctx, w.bathroom, t) });   // section 10c
  for (const m of w.messes) list.push({ d: m.depth, f: () => drawMess(ctx, m) });
  for (const cr of w.critters) list.push({ d: cr.depth, f: () => drawCritter(ctx, cr) });
  for (const bg of w.bags) list.push({ d: bg.depth, f: () => drawMysteryBag(ctx, bg, t) });
  for (const c of w.customers.list) if (c.state !== CS.IN_BATH) list.push({ d: c.depth + 0.01, f: () => drawCustomer(ctx, c, w.selected === c), o: () => drawCustomerOverlay(ctx, c) });
  list.push({ d: w.player.depth, f: () => drawPlayer(ctx, w.player, t), o: () => drawPlayerOverlay(ctx, w.player, t) });
  for (const cop of w.raid.cops) list.push({ d: cop.x + cop.y + 0.02, f: () => drawCop(ctx, cop) });
  list.sort((a, b) => a.d - b.d);
  for (const r of list) r.f();
  if (hovered && hovered.hit) {
    const h = hovered.hit; ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = 'rgba(255,235,190,0.6)'; ctx.lineWidth = 1.5;
    rrect(ctx, h.x - 3, h.y - 3, h.w + 6, h.h + 6, 6); ctx.stroke(); ctx.restore();
  }
  for (const r of list) if (r.o) r.o();   // overlays are never hidden behind props
  drawTutorialHighlight(ctx, w);
  w.player.tasks.forEach((task, i) => {
    const p = P(task.point.x, task.point.y);
    ellipse(ctx, p.x, p.y, 11, 11, i === 0 ? '#ffd35a' : 'rgba(255,211,90,0.7)');
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    text(ctx, `${i + 1}`, p.x, p.y + 1, { size: 12, color: '#222' });
  });
  for (const f of w.floaters) {
    const p = P(f.x, f.y); ctx.save(); ctx.globalAlpha = clamp(1.4 - f.t, 0, 1);
    text(ctx, f.text, p.x, p.y - 84 - f.t * 40 + f.dy, { size: 15, color: f.color, stroke: 'rgba(0,0,0,0.85)' });
    ctx.restore();
  }
}
// ---- HUD ----
// ---- Swappable interface art (asset-swap "Interface" group) ----
// uiSprite stretches a swapped image over a rectangle; uiCover fills a rectangle, cropping to keep proportions.
// Both return false when there's no swapped image, so the caller draws the built-in art instead.
function uiSprite(ctx, key, x, y, w, h, alpha = 1) {
  if (!useSprite(key)) return false;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.drawImage(tintedImg(key, Sprites.entry(key).img), x, y, w, h); ctx.restore();
  return true;
}
function uiCover(ctx, key, x, y, w, h) {
  if (!useSprite(key)) return false;
  const img = Sprites.entry(key).img, s = Math.max(w / img.width, h / img.height);
  const sw = w / s, sh = h / s;
  ctx.drawImage(tintedImg(key, img), (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
  return true;
}
function drawPanel(ctx, x, y, w, h, opacity = 1) {
  ctx.save(); wonk(ctx, x, y, w, h, 0.8);                      // a little crooked
  ctx.globalAlpha *= opacity;
  if (!uiSprite(ctx, "ui_panel", x, y, w, h)) withColor(ctx, "ui_panel", c => drawCardboard(c, x, y, w, h, 3), { x: x - 12, y: y - 12, w: w + 24, h: h + 24 });   // SPRITE HOOK
  ctx.restore();
}

// ---- Movable interface (dev panel "Interface layout") ----
// Each gameplay panel can be moved (x, y in px) and rotated (degrees) around its center. Offsets live in
// Sprites.tweaks["layout:<id>"], so they save, load and "Save to project" exactly like sprite settings.
const UI_LAYOUT = [
  { id: 'tag_shift',     label: 'Shift name tag',           rect: [12, 8, 262, 48] },
  { id: 'tag_cash',      label: 'Cash / goal tag',          rect: [314, 6, 458, 52] },
  { id: 'tag_rep',       label: 'Reputation tag',           rect: [786, 10, 166, 42] },
  { id: 'tag_customers', label: 'Customers-left tag',       rect: [962, 8, 160, 44] },
  { id: "tag_suspicion", label: "Suspicion tag",            rect: [12, 72, 228, 46] },
  { id: 'buttons_top',   label: 'Fullscreen / pause / sound buttons', rect: [1134, 12, 132, 32] },
  { id: 'tutorial',      label: 'Tutorial strip',           rect: [240, 60, 800, 52] },
  { id: 'panel_hands',   label: 'Hands panel',              rect: [16, 600, 290, 104] },
  { id: "panel_orders",  label: "Orders panel",             rect: [322, 600, 524, 104] },
  { id: "panel_recipes", label: "Recipes panel",            rect: [858, 556, 406, 148] },
  { id: "buttons_zoom",  label: "Zoom buttons",             rect: [1100, 520, 166, 32] },
];
const layoutOf = id => {
  const L = Sprites.tweaks[`layout:${id}`], def = UI_LAYOUT.find(l => l.id === id);
  if (!def || !L || (!L.x && !L.y && !L.rot)) return null;
  const [x, y, w, h] = def.rect;
  return { cx: x + w / 2, cy: y + h / 2, dx: L.x || 0, dy: -(L.y || 0), rot: (L.rot || 0) * Math.PI / 180 };   // y > 0 moves up
};
function withLayout(ctx, id, fn) {
  const L = layoutOf(id); if (!L) return fn();
  ctx.save(); ctx.translate(L.cx + L.dx, L.cy + L.dy); ctx.rotate(L.rot); ctx.translate(-L.cx, -L.cy);
  try { return fn(); } finally { ctx.restore(); }
}
// True when a screen point is on one of the gameplay panels (wherever they've been moved), so clicks there
// don't fall through to the room.
function overPanel(x, y) {
  return UI_LAYOUT.some(L => { const p = layoutInverse(L.id, x, y), [rx, ry, rw, rh] = L.rect; return p.x >= rx && p.x <= rx + rw && p.y >= ry && p.y <= ry + rh; });
}
// Screen point → that panel's original coordinates (so moved buttons are still clickable where you see them).
function layoutInverse(id, x, y) {
  const L = layoutOf(id); if (!L) return { x, y };
  const px = x - L.cx - L.dx, py = y - L.cy - L.dy, c = Math.cos(-L.rot), s = Math.sin(-L.rot);
  return { x: px * c - py * s + L.cx, y: px * s + py * c + L.cy };
}

function onGamePanels(fn) { const prev = THEME.panelScale; THEME.panelScale = THEME.hudScale; try { return fn(); } finally { THEME.panelScale = prev; } }

/* ---- UI button ---- */
class Button {
  constructor(x, y, w, h, label, onClick, o = {}) { Object.assign(this, { x, y, w, h, label, onClick, o }); }
  contains(mx, my) {
    if (this.o.layout) ({ x: mx, y: my } = layoutInverse(this.o.layout, mx, my));   // follows its moved panel
    return !this.o.disabled && mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h;
  }
  draw(ctx) {                                            // crooked cardboard button, black marker label
    const body = () => { ctx.save(); wonk(ctx, this.x, this.y, this.w, this.h, this.w < 60 ? 0.6 : 1.2); onCardboard(() => this.drawInk(ctx)); ctx.restore(); };
    if (this.o.layout) withLayout(ctx, this.o.layout, body); else body();
  }
  drawInk(ctx) {
    const hover = this.contains(Game.mouse.x, Game.mouse.y);
    if (!uiSprite(ctx, 'ui_button', this.x, this.y, this.w, this.h, this.o.disabled ? 0.45 : 1)) {   // SPRITE HOOK
      ctx.save(); if (this.o.disabled) ctx.globalAlpha = 0.5;
      withColor(ctx, "ui_button", c => drawCardboard(c, this.x, this.y, this.w, this.h, 5), { x: this.x - 12, y: this.y - 12, w: this.w + 24, h: this.h + 24 }); ctx.restore();
    }
    if (hover) { rrect(ctx, this.x + 3, this.y + 3, this.w - 6, this.h - 6, 8); ctx.fillStyle = 'rgba(255,245,220,0.18)'; ctx.fill(); }
    const cy = this.y + this.h / 2 + (this.o.sub ? -9 : 1);
    text(ctx, typeof this.label === 'function' ? this.label() : this.label, this.x + this.w / 2, cy,
      { size: this.o.size || 18, color: this.o.disabled ? '#9a93ad' : '#fff' });
    if (this.o.sub) text(ctx, this.o.sub, this.x + this.w / 2, cy + 22, { size: 12, color: '#cfc8e0', weight: 'normal' });
  }
}

/* ============================== 13. GAME STATE MACHINE ===================== */
class StateMachine {
  constructor() { this.states = {}; this.current = null; this.name = null; }
  add(name, state) { this.states[name] = state; return this; }
  change(name, params) {
    if (this.current && this.current.exit) this.current.exit(name);
    this.name = name; this.current = this.states[name];
    if (this.current.enter) this.current.enter(params || {});
  }
  update(dt)       { if (this.current.update) this.current.update(dt); }
  render(ctx)      { this.current.render(ctx); }
  click(x, y)      { if (this.current.click) this.current.click(x, y); }
  key(k)           { if (this.current.key) this.current.key(k); }
}

function drawBackdrop(ctx, t) {
  if (uiCover(ctx, 'ui_menu_bg', 0, 0, VIEW.W, VIEW.H)) return;   // SPRITE HOOK: title, intro, shop, victory
  // built-in: a big flattened cardboard box filling the screen
  const g = ctx.createRadialGradient(VIEW.W / 2, VIEW.H / 2, 200, VIEW.W / 2, VIEW.H / 2, 800);
  g.addColorStop(0, THEME.cardLight); g.addColorStop(1, THEME.cardDark);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW.W, VIEW.H);
  ctx.strokeStyle = 'rgba(110,75,35,0.16)'; ctx.lineWidth = 1.5;
  for (let x = 6; x < VIEW.W; x += 11) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIEW.H); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(90,60,25,0.35)'; ctx.lineWidth = 3;                     // fold creases
  for (const y of [VIEW.H * 0.32, VIEW.H * 0.71]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIEW.W, y + 4); ctx.stroke(); }
}
function drawOverlay(ctx, a = 0.65) { ctx.fillStyle = `rgba(8,6,12,${a})`; ctx.fillRect(0, 0, VIEW.W, VIEW.H); }
function clickButtons(buttons, x, y) {
  for (const b of buttons) if (b.contains(x, y)) { Events.emit('uiClick'); AudioManager.play('click'); b.onClick(); return true; }

}

/* ---- Camera: zoom + pan over the room ----
   Mouse wheel / pinch, + and − keys or the on-screen buttons zoom toward the cursor. Right-drag,
   middle-drag or Space + drag pans, as do the arrow keys / WASD. 0 or "Fit" frames the whole room.
   Everything in the room is drawn inside Camera.apply(); the HUD is drawn after, unzoomed. */
const Camera = {
  zoom: 1, settledZoom: 1, x: 640, y: 315, lastZoomAt: 0, drag: null,
  MIN: 0.9, MAX: 2.8,
  VIEW: { x: 0, y: 56, w: VIEW.W, h: 544 },          // play area between the top bar and the bottom panels
  CONTENT: { x: 288, y: 92, w: 764, h: 446 },         // everything that matters in the room (unzoomed units)
  get fitZoom() { return Math.min(this.VIEW.w / this.CONTENT.w, this.VIEW.h / this.CONTENT.h); },
  fit() {
    this.zoom = this.settledZoom = clamp(this.fitZoom, this.MIN, this.MAX);
    this.x = this.CONTENT.x + this.CONTENT.w / 2; this.y = this.CONTENT.y + this.CONTENT.h / 2;
  },
  get cx() { return this.VIEW.x + this.VIEW.w / 2; },
  get cy() { return this.VIEW.y + this.VIEW.h / 2; },
  apply(ctx) { ctx.translate(this.cx, this.cy); ctx.scale(this.zoom, this.zoom); ctx.translate(-this.x, -this.y); },
  toWorld(sx, sy) { return { x: (sx - this.cx) / this.zoom + this.x, y: (sy - this.cy) / this.zoom + this.y }; },
  zoomAt(sx, sy, factor) {
    const before = this.toWorld(sx, sy);
    this.zoom = clamp(this.zoom * factor, this.MIN, this.MAX);
    const after = this.toWorld(sx, sy);
    this.x += before.x - after.x; this.y += before.y - after.y;
    this.lastZoomAt = performance.now(); this.clampPan();
  },
  pan(dx, dy) { this.x -= dx / this.zoom; this.y -= dy / this.zoom; this.clampPan(); },
  // Keep the view over the room: the visible area can't drift past the room's edges.
  clampPan() {
    const C = this.CONTENT, hw = this.VIEW.w / 2 / this.zoom, hh = this.VIEW.h / 2 / this.zoom;
    this.x = hw * 2 >= C.w ? C.x + C.w / 2 : clamp(this.x, C.x + hw, C.x + C.w - hw);
    this.y = hh * 2 >= C.h ? C.y + C.h / 2 : clamp(this.y, C.y + hh, C.y + C.h - hh);
  },
  update(dt) {
    // re-render the room at the new resolution once zooming pauses (redrawing on every wheel tick would stutter)
    if (this.settledZoom !== this.zoom && performance.now() - this.lastZoomAt > 160) this.settledZoom = this.zoom;
    const k = Game.keys, sp = 650 * dt;
    const dx = (k.has('ArrowLeft') || k.has('a') ? sp : 0) - (k.has('ArrowRight') || k.has('d') ? sp : 0);
    const dy = (k.has('ArrowUp') || k.has('w') ? sp : 0) - (k.has('ArrowDown') || k.has('s') ? sp : 0);
    if (dx || dy) this.pan(dx, dy);
  },
};
function toggleFullscreen() {
  const d = document;
  try {
    if (d.fullscreenElement) { d.exitFullscreen(); return; }
    const p = d.documentElement.requestFullscreen && d.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => Game.world && Game.world.say('Fullscreen is blocked here. Open the game in a browser tab.', Game.world.player, '#ffd35a'));
  } catch (e) {}
}

const PlayState = {
  enter(params) {
    if (params.resume) return;
    if (Game.world) Game.world.destroy();
    this.index = params.index;
    Game.world = new World(LEVELS[params.index], Game.session);
    this.hovered = null;
    Camera.fit();
    const top = { size: 14, color: '#3a3448', layout: 'buttons_top' }, zoom = { size: 18, color: '#3a3448', layout: 'buttons_zoom' };
    this.ui = [
      new Button(1134, 12, 40, 32, '⛶', toggleFullscreen, top),
      new Button(1180, 12, 40, 32, 'II', () => Game.sm.change('pause'), top),
      new Button(1226, 12, 40, 32, () => AudioManager.muted ? '×' : '♪', () => AudioManager.toggleMute(), { ...top, size: 16 }),
      new Button(1138, 520, 34, 32, '−', () => Camera.zoomAt(Camera.cx, Camera.cy, 1 / 1.25), zoom),
      new Button(1176, 520, 34, 32, '+', () => Camera.zoomAt(Camera.cx, Camera.cy, 1.25), zoom),
      new Button(1214, 520, 52, 32, 'Fit', () => Camera.fit(), { ...zoom, size: 14 }),
    ];
    AudioManager.playMusic("shift");
    this.cutscenePending = !!CUTSCENE.lines[LEVELS[params.index].id] && !(Game.session.seenCutscenes || {})[params.index];
  },
  update(dt) {
    if (this.cutscenePending) { this.cutscenePending = false; return Game.sm.change("cutscene", { index: this.index }); }   // boss pops up first
    const w = Game.world;
    w.update(dt);
    Camera.update(dt);
    const m = Camera.toWorld(Game.mouse.x, Game.mouse.y);
    this.hovered = Game.mouse.y > Camera.VIEW.y && !overPanel(Game.mouse.x, Game.mouse.y) ? this.hitTest(m.x, m.y) : null;
    if (w.raid.state === "bustDone") return this.finish(false, "BUSTED! Suspicion hit 100.");
    if (w.score.rep <= 0) return this.finish(false, 'Your reputation hit rock bottom.');
    if (w.checkShiftOver(dt)) this.finish(w.score.cash >= w.level.goal);
  },
  finish(win, reason) { Game.sm.change('levelEnd', { index: this.index, win, reason }); },
  hitTest(x, y) {
    const w = Game.world;
    for (const e of w.clickables()) if (inRect(e.hit, x, y)) return e;
    return null;
  },
  render(ctx) {
    ctx.fillStyle = "#110e17"; ctx.fillRect(0, 0, VIEW.W, VIEW.H);
    const w = Game.world;
    ctx.save(); Camera.apply(ctx);
    drawWorld(ctx, w, this.hovered);
    ctx.restore();
    drawChaosScreenFX(ctx, w);   // flicker + critical suspicion edge (section 10c)
    drawMemoryFX(ctx, w);
    if (w.raid.active) drawRaidFX(ctx, w.raid);
    drawTutorial(ctx, w);
    drawHUD(ctx, w, this.ui);
    withLayout(ctx, 'buttons_zoom', () => text(ctx, `${Math.round(Camera.zoom / Camera.fitZoom * 100)}%`, 1124, 536, { align: "right", size: 12, color: '#cfc8e0', stroke: 'rgba(0,0,0,0.7)' }));
    if (w.customers.spawned >= w.level.customers && !w.customers.list.length && w.booths.some(b => b.state === 'dirty'))
      text(ctx, 'Last customer gone — collect your cash!', 640, 130, { size: 18, color: '#7ee787', stroke: '#000' });
  },
  click(x, y) {
    if (clickButtons(this.ui, x, y)) return;
    if (y < Camera.VIEW.y || overPanel(x, y)) return;      // top bar and the panels aren't part of the room
    ({ x, y } = Camera.toWorld(x, y));
    const w = Game.world, e = this.hitTest(x, y);
    if (!e) {
      const p = toWorld(x, y);
      w.selected = null;
      if (p.x > 0.3 && p.y > 0.3 && p.x < WORLD.W - 0.3 && p.y < WORLD.H - 0.3)
        w.player.enqueue({ kind: 'floor', servicePoint: () => ({ x: p.x, y: p.y }) });
      return;
    }
    if (e.kind === 'customer') {
      if (e.state === CS.QUEUED || e.state === CS.ENTERING) {
        w.selected = w.selected === e ? null : e;
        if (w.selected) Events.emit('customerSelected', { customer: e });
        return;
      }
      if (e.booth) return this.clickBooth(e.booth);
      return;
    }
    if (e.kind === 'booth') return this.clickBooth(e);
    w.selected = null;
    w.player.enqueue(e);
  },
  clickBooth(b) {
    const w = Game.world;
    if (b.state === 'empty' && !b.broken) {
      // Seat the selected customer, or the front of the line if nobody is selected.
      if (w.raid.active) { w.say('Not with cops here!', b, '#ff8a80'); return; }
      const c = w.selected || w.customers.queue[0];
      if (c) return w.customers.seat(c, b);
      w.say('No one to seat', b, '#bbb'); return;
    }
    w.selected = null;
    w.player.enqueue(b);
  },
  key(k) {
    if (k === 'p' || k === 'P') Game.sm.change('pause');
    if (k === 'Escape') Game.world.selected = null;
    if (k === '+' || k === '=') Camera.zoomAt(Camera.cx, Camera.cy, 1.25);
    if (k === '-' || k === '_') Camera.zoomAt(Camera.cx, Camera.cy, 1 / 1.25);
    if (k === '0') Camera.fit();
  },
};

/* ---- Shift-start cutscene (Zombie Café-style pop-up) ----
   The screen dims, the boss pops up from the bottom-left and his lines type out in a cardboard speech box.
   Click / Space / Enter: finish the line, then go to the next. Skip or Esc jumps straight to the shift.
   Plays once per run for each shift. Edit the lines here; swap the boss art in the dev panel ("Cutscenes"). */
const CUTSCENE = {
  speaker: 'Skeeter',
  typeSpeed: 38,          // characters per second
  lines: {                // shift number → lines, in order
    1: ['You better make that $500 back tonight or I will cut those fingers off and feed them to Junior Roach with the 18 wheeler.',
        "Clock's tickin'. Get to cookin'. And don't you dare serve nobody early. I ain't payin' for no more ambulances."],
    2: ["Heh. You made it through last night. Lucky.", "Tonight I want that Red Cloud flyin' off the shelves. Mix it FIRST. Don't make me explain it twice."],
    3: ["Rush hour, baby. Them jittery folks tip big, but they bite.", "Keep 'em happy, or Junior Roach gets a snack. Five little snacks."],
    4: ["Got the cooler workin'. Don't ask me where I got it.", "Glass Grade is premium. You mess it up, I mess YOU up."],
    5: ["Big night. Big spenders. Big trouble if you choke.", "Make me proud... or make me mad. Junior Roach is idlin' right outside."],
  },
};
const CutsceneState = {
  enter({ index }) {
    this.index = index; this.lines = CUTSCENE.lines[LEVELS[index].id] || [];
    this.i = 0; this.chars = 0; this.t = 0; this.lastBlip = 0;
    this.skip = new Button(1150, 74, 104, 40, 'Skip', () => this.finish(), { size: 16 });
    if (!this.lines.length) this.finish();
  },
  get line() { return this.lines[this.i] || ''; },
  get typing() { return this.chars < this.line.length; },
  update(dt) {
    this.t += dt;
    if (this.t < 0.45 || !this.typing) return;                  // wait for the pop-up, then type
    this.chars = Math.min(this.line.length, this.chars + dt * CUTSCENE.typeSpeed);
    if (Math.floor(this.chars / 3) !== this.lastBlip) { this.lastBlip = Math.floor(this.chars / 3); AudioManager.play('talk'); }
  },
  advance() {
    if (this.t < 0.45) { this.t = 0.45; return; }               // first click finishes the pop-up
    if (this.typing) { this.chars = this.line.length; return; }  // next click finishes the line
    if (++this.i >= this.lines.length) return this.finish();
    this.chars = 0; this.lastBlip = 0;
  },
  finish() {
    Game.session.seenCutscenes[this.index] = true;
    Game.sm.change('play', { resume: true });
  },
  render(ctx) {
    PlayState.render(ctx);                                      // the shift, frozen behind the scene
    drawOverlay(ctx, 0.55);
    const pop = clamp(this.t / 0.45, 0, 1), ease = 1 - Math.pow(1 - pop, 3) + Math.sin(pop * Math.PI) * 0.08;
    const talking = this.typing && pop >= 1;
    const bob = talking && !REDUCED_MOTION ? Math.abs(Math.sin(this.t * 14)) * 5 : Math.sin(this.t * 2) * 2;
    const px = -260 + ease * 450, feet = 712 - bob;
    // the boss
    if (useSprite('cutscene_boss')) Sprites.draw(ctx, 'cutscene_boss', px, feet, { fitH: 470 });   // SPRITE HOOK
    else {                                                      // built-in stand-in: a big, twitchy, scruffy guy
      ctx.save(); ctx.translate(px, feet); ctx.scale(6.2, 6.2); const o = P(0, 0); ctx.translate(-o.x, -o.y);
      drawCharacter(ctx, 0, 0, { body: '#6f6a3e', pants: '#3b3226', skin: '#d9b48c', hair: '#5a4630', style: 'messy', tired: true, stubble: true,
        facing: 1, excited: talking && Math.sin(this.t * 22) > 0, mood: 0.2, t: this.t });
      ctx.restore();
    }
    // speech box
    if (pop < 0.6) return;
    ctx.save(); ctx.globalAlpha = clamp((pop - 0.6) / 0.4, 0, 1);
    const B = { x: 360, y: 452, w: 880, h: 200 };
    drawPanel(ctx, B.x, B.y, B.w, B.h);
    drawPanel(ctx, B.x + 26, B.y - 34, 210, 52);               // name tag
    onCardboard(() => {
      text(ctx, CUTSCENE.speaker, B.x + 131, B.y - 8, { size: 24, color: '#b3261e' });
      const size = Math.round(22 * THEME.textScale), font = `normal ${size}px ${FONT}`;
      const shown = this.line.slice(0, Math.floor(this.chars));
      // wrap the whole line once so words don't jump between rows while typing
      const rows = wrapText(ctx, this.line, B.w - 90, font); let left = shown.length;
      rows.slice(0, 4).forEach((row, r) => {
        const part = row.slice(0, Math.max(0, left)); left -= row.length + 1;
        if (part) text(ctx, part, B.x + 44, B.y + 44 + r * (size + 8), { align: 'left', size: 22, straight: true });
      });
      if (!this.typing && pop >= 1 && Math.floor(this.t * 2.5) % 2 === 0)
        text(ctx, this.i < this.lines.length - 1 ? 'click to continue  >' : 'click to start the shift  >', B.x + B.w - 40, B.y + B.h - 26, { align: 'right', size: 14, color: '#4d3b26' });
    });
    ctx.restore();
    this.skip.draw(ctx);
  },
  click(x, y) { if (this.skip.contains(x, y)) { AudioManager.play('click'); return this.finish(); } this.advance(); },
  key(k) { if (k === ' ' || k === 'Enter') this.advance(); if (k === 'Escape') this.finish(); },
};

const ShopState = {
  // Tabs: LAB UPGRADES (the original honest upgrades), BARGAIN BIN (cheap gear with hidden downsides, section 10c)
  // and REPAIRS (fix equipment wear between shifts).
  enter({ nextIndex }) {
    this.nextIndex = nextIndex; this.t = 0; this.tab = this.tab || 'lab'; AudioManager.playMusic('shop');
    // what the Bargain Bin has in stock this visit: commons always, rares on a coin flip, uncommon 70%
    const s = Game.session; s.binStock = s.binStock || {};
    if (s.binStock.visit !== nextIndex) {
      const odds = { common: 1, uncommon: 0.7, rare: 0.5 };
      s.binStock = { visit: nextIndex, ids: UPGRADES.filter(u => u.bargain && nextIndex >= (u.minShift || 0) && Math.random() < (odds[u.rarity] ?? 1)).map(u => u.id) };
    }
    this.build();
  },
  repairCost(type) { return Math.ceil(((Game.session.wear || {})[type] || 0) * CHAOS_CONFIG.equipment.shopRepairCostPerWear); },
  build() {
    const s = Game.session, up = s.upgrades;
    this.buttons = [];
    const tabs = [['lab', 'LAB UPGRADES'], ['bin', 'BARGAIN BIN'], ['fix', 'REPAIRS']];
    tabs.forEach(([id, label], i) => this.buttons.push(new Button(250 + i * 270, 150, 250, 44, label, () => { this.tab = id; this.build(); },
      { size: 16, color: this.tab === id ? '#2fbf71' : '#4b3f8a', tab: id })));
    if (this.tab === 'fix') {
      const wear = s.wear || {}, types = STATION_ORDER.filter(t => LEVELS[this.nextIndex].stations.includes(t) || (wear[t] || 0) > 0);
      types.forEach((type, i) => {
        const cost = this.repairCost(type), w = Math.round(wear[type] || 0);
        const cond = stationCondition({ wear: w, broken: w >= 100 });
        this.buttons.push(new Button(250 + (i % 2) * 400, 214 + Math.floor(i / 2) * 90, 380, 76, cost ? `Fix ${STATION_DEFS[type].name}  ($${cost})` : `${STATION_DEFS[type].name} — GOOD`, () => {
          s.bank -= cost; s.wear[type] = 0; Events.emit('upgradeBought', { id: `repair_${type}` }); this.build();
        }, { size: 16, disabled: !cost || s.bank < cost, color: '#8a5a2e', sub: `${cond.toUpperCase()} · wear ${w}/100` }));
      });
      const all = types.reduce((n, t) => n + this.repairCost(t), 0);
      this.buttons.push(new Button(450, 400, 380, 60, all ? `Fix everything ($${all})` : 'Everything runs fine', () => {
        s.bank -= all; for (const t of types) s.wear[t] = 0; Events.emit('upgradeBought', { id: 'repair_all' }); this.build();
      }, { size: 16, disabled: !all || s.bank < all, color: '#2f7fbf', sub: 'In-shift fixes are quick patches; this is the real deal.' }));
    } else {
      const list = this.tab === 'bin' ? UPGRADES.filter(u => u.bargain && (s.binStock.ids || []).includes(u.id)) : UPGRADES.filter(u => !u.bargain);
      list.forEach((u, i) => {
        const lvl = up[u.id] || 0, maxed = lvl >= u.max, cost = u.cost[lvl];
        const col = i % 2, row = Math.floor(i / 2), known = (s.discovered || {})[u.id];
        const sub = u.bargain ? (known ? `${u.desc} · KNOWN ISSUE: ${u.hidden}` : `${u.desc} · "${u.blurb}"`) : u.desc;
        this.buttons.push(new Button(250 + col * 400, 228 + row * 86, 380, 76, maxed ? `${u.name} — OWNED` : `${u.name}  ($${cost})`, () => {
          s.bank -= cost; up[u.id] = lvl + 1;
          Events.emit('upgradeBought', { id: u.id, level: lvl + 1 }); this.build();
        }, { size: 16, disabled: maxed || s.bank < cost, color: u.bargain ? '#7a4a2a' : '#4b3f8a', upgrade: u, lvl, sub }));
      });
      if (this.tab === 'bin' && !list.length) this.emptyBin = true; else this.emptyBin = false;
    }
    this.buttons.push(new Button(540, 600, 200, 56, `START SHIFT ${this.nextIndex + 1}`, () => Game.sm.change('intro', { index: this.nextIndex }), { color: '#2fbf71' }));

/* ---- Cook select (layout inspired by Zombie Café's chef board) ----
   Left: torn paper pinned to a brick wall with one row per cook. Right: chalkboard with the
   previewed cook's stats, ability, full-body art and a SELECT button. BACK sits bottom-right.
   All art here is placeholder; swap it via the cook_<id>_portrait / cook_<id>_full sprite keys. */
const DISPLAY_FONT = FONT;   // headings use the same marker hand
const CHALK = '#efece2';

function wrapText(ctx, str, maxW, font) {
  ctx.font = font; const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? `${cur} ${w}` : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function drawBrickWall(ctx) {
  if (uiCover(ctx, 'cs_background', 0, 0, VIEW.W, VIEW.H)) return;   // SPRITE HOOK
  const rng = mulberry32(7);
  ctx.fillStyle = '#c9b28a'; ctx.fillRect(0, 0, VIEW.W, VIEW.H);           // mortar
  const BW = 86, BH = 36;
  for (let r = 0, y = 0; y < VIEW.H; r++, y += BH) {
    for (let x = (r % 2) * -BW / 2; x < VIEW.W; x += BW) {
      ctx.fillStyle = shade('#dccaa5', (rng() - 0.5) * 0.12);
      rrect(ctx, x + 3, y + 3, BW - 6, BH - 6, 3); ctx.fill();
      if (rng() < 0.15) { ctx.fillStyle = 'rgba(90,60,30,0.12)'; ctx.beginPath(); ctx.ellipse(x + BW * rng(), y + BH / 2, 14, 6, 0, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  const g = ctx.createRadialGradient(VIEW.W / 2, VIEW.H / 2, 260, VIEW.W / 2, VIEW.H / 2, 820);
  g.addColorStop(0, 'rgba(40,20,5,0)'); g.addColorStop(1, 'rgba(40,20,5,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW.W, VIEW.H);
}
function drawAwning(ctx) {
  if (uiSprite(ctx, 'cs_awning', 0, 0, VIEW.W, 60)) return;          // SPRITE HOOK
  ctx.fillStyle = '#5e1418'; ctx.fillRect(0, 0, VIEW.W, 20);
  const R = 34;
  for (let i = 0, x = 0; x < VIEW.W + R; i++, x += R * 2) {
    ctx.beginPath(); ctx.moveTo(x - R, 14); ctx.arc(x, 14, R, 0, Math.PI); ctx.closePath();
    const g = ctx.createLinearGradient(0, 14, 0, 14 + R);
    g.addColorStop(0, i % 2 ? '#8e2329' : '#7a1c22'); g.addColorStop(1, i % 2 ? '#5e1418' : '#4e1014');
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#2a0a0c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, 14, R - 8, 0.3, Math.PI - 0.3); ctx.strokeStyle = 'rgba(255,200,190,0.18)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 48, VIEW.W, 4);
}
function drawTornPaper(ctx, x, y, w, h) {
  if (uiSprite(ctx, 'cs_paper', x, y, w, h)) return;                 // SPRITE HOOK
  const rng = mulberry32(31), pts = [];
  for (let px = x; px <= x + w; px += 18) pts.push({ x: px, y: y + rng() * 10 });
  for (let py = y; py <= y + h; py += 18) pts.push({ x: x + w - rng() * 10, y: py });
  for (let px = x + w; px >= x; px -= 18) pts.push({ x: px, y: y + h - rng() * 12 });
  for (let py = y + h; py >= y; py -= 18) pts.push({ x: x + rng() * 10, y: py });
  ctx.save(); ctx.shadowColor = 'rgba(30,15,0,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#f3f1ec'); g.addColorStop(1, '#d9d5cc');
  poly(ctx, pts, g); ctx.restore();
  poly(ctx, pts, null, 'rgba(60,50,40,0.35)', 1);
  ctx.strokeStyle = 'rgba(120,110,95,0.22)'; ctx.lineWidth = 1.5;                   // fold creases
  for (const [a, b] of [[[x, y + h * 0.36], [x + w, y + h * 0.33]], [[x, y + h * 0.68], [x + w, y + h * 0.7]], [[x + w * 0.5, y], [x + w * 0.52, y + h]]]) {
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(150,120,70,0.12)'; ctx.beginPath(); ctx.ellipse(x + rng() * w, y + rng() * h, 10 + rng() * 25, 6 + rng() * 14, rng() * 3, 0, Math.PI * 2); ctx.fill(); }
}
function drawPushPin(ctx, x, y) {
  ellipse(ctx, x + 6, y + 10, 9, 4, 'rgba(0,0,0,0.3)');
  const g = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, 13); g.addColorStop(0, '#ff6b6b'); g.addColorStop(1, '#a3121b');
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#4a0509'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 4, y - 4, 3.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
}
// Hand-drawn marker loop around the chosen cook.
function drawMarkerCircle(ctx, x, y, rx, ry, t) {
  ctx.save(); ctx.strokeStyle = '#c8261e'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (let a = 0; a <= Math.PI * 2.15; a += 0.12) {
    const wob = 1 + Math.sin(a * 3 + 1) * 0.04 + a * 0.01;
    const px = x + Math.cos(a - 0.6) * rx * wob, py = y + Math.sin(a - 0.6) * ry * wob;
    if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke(); ctx.restore();
}
// Placeholder art: a plain head and a plain body in the cook's color, numbered.
function drawCookPortrait(ctx, cook, idx, cx, cy) {
  const key = `cook_${cook.id}_portrait`;
  if (useSprite(key)) return Sprites.draw(ctx, key, cx, cy + 56, { fitH: 112 });   // SPRITE HOOK
  const rig = cookRig(cook); if (rig) return rig.portrait(ctx, cx, cy, 112);   // head from the parts sheet
  ctx.beginPath(); ctx.ellipse(cx, cy, 50, 56, 0, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(cx - 14, cy - 18, 6, cx, cy, 60); g.addColorStop(0, shade(cook.color, 0.35)); g.addColorStop(1, shade(cook.color, -0.15));
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  text(ctx, `${idx + 1}`, cx, cy + 4, { size: 44, font: DISPLAY_FONT, weight: 'normal', color: '#fff', stroke: INK, strokeW: 5 });
}
function drawCookFull(ctx, cook, idx, cx, feetY, t) {
  const key = `cook_${cook.id}_full`, bob = REDUCED_MOTION ? 0 : Math.sin(t * 2.4) * 3;
  if (useSprite(key)) return Sprites.draw(ctx, key, cx, feetY, { fitH: 230 });       // SPRITE HOOK
  const rig = cookRig(cook); if (rig) return rig.draw(ctx, cx, feetY, { t, height: 240, shadow: false });   // idle, animated
  ctx.save(); ctx.strokeStyle = CHALK; ctx.lineWidth = 3; ctx.setLineDash([7, 5]);
  rrect(ctx, cx - 42, feetY - 150 + bob, 84, 150 - bob, 26); ctx.fillStyle = 'rgba(239,236,226,0.08)'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, feetY - 190 + bob, 36, 0, Math.PI * 2); ctx.fillStyle = shade(cook.color, -0.1); ctx.fill(); ctx.stroke();
  ctx.restore();
  text(ctx, `${idx + 1}`, cx, feetY - 186 + bob, { size: 34, font: DISPLAY_FONT, weight: 'normal', color: CHALK });
  text(ctx, 'ART', cx, feetY - 75, { size: 20, font: DISPLAY_FONT, weight: 'normal', color: 'rgba(239,236,226,0.55)' });
}

const CookSelectState = {
  PAPER: { x: 110, y: 92, w: 500, h: 560 },
  BOARD: { x: 680, y: 88, w: 520, h: 560 },
  enter(params = {}) {
    this.t = 0;
    this.sel = Math.max(0, COOKS.findIndex(c => c.id === Game.session.cook));
    this.then = params.then || (() => Game.sm.change('intro', { index: 0 }));
    this.back = params.back || (() => Game.sm.change('title'));
    const P0 = this.PAPER;
    const gap = Math.min(165, (P0.h - 40) / COOKS.length);   // rows shrink to fit every cook on the paper
    this.rows = COOKS.map((c, i) => ({ x: P0.x + 30, y: P0.y + 24 + i * gap, w: P0.w - 60, h: gap - 10 }));
    this.selectBtn = { x: this.BOARD.x + 80, y: this.BOARD.y + 460, w: this.BOARD.w - 160, h: 60 };
    this.backBtn = { x: 1090, y: 650, w: 160, h: 56 };
  },
  update(dt) { this.t += dt; },
  preview(i) { if (i !== this.sel) { this.sel = i; Events.emit('customerSelected'); } },   // reuses the "select" blip
  confirm() { Game.session.cook = COOKS[this.sel].id; Events.emit('cookSelected', { cook: Game.session.cook }); this.then(); },
  render(ctx) {
    const t = this.t, m = Game.mouse;
    drawBrickWall(ctx); drawAwning(ctx);
    // ---- paper with one row per cook ----
    const PP = this.PAPER;
    ctx.save(); ctx.translate(PP.x + PP.w / 2, PP.y + PP.h / 2); ctx.rotate(-0.012); ctx.translate(-(PP.x + PP.w / 2), -(PP.y + PP.h / 2));
    drawTornPaper(ctx, PP.x, PP.y, PP.w, PP.h);
    COOKS.forEach((c, i) => {
      const r = this.rows[i], hover = inRect(r, m.x, m.y), lift = hover && i !== this.sel ? -3 : 0;
      const hx = r.x + 85, hy = r.y + r.h / 2 + lift;
      if (i === this.sel) drawMarkerCircle(ctx, r.x + r.w / 2 - 6, r.y + r.h / 2, r.w / 2 - 4, r.h / 2 - 4, t);
      drawCookPortrait(ctx, c, i, hx, hy);
      text(ctx, c.name, r.x + 160, hy - 16, { align: 'left', size: 30, font: DISPLAY_FONT, weight: 'normal', color: '#2b2118' });
      text(ctx, c.ability, r.x + 160, hy + 20, { align: 'left', size: 19, font: DISPLAY_FONT, weight: 'normal', color: '#8e2329' });
    });
    ctx.restore();
    drawPushPin(ctx, PP.x + PP.w / 2, PP.y + 6);

    // ---- chalkboard ----
    const B = this.BOARD, c = COOKS[this.sel];
    const I = { x: B.x + 18, y: B.y + 18, w: B.w - 36, h: B.h - 36 };
    if (!uiSprite(ctx, 'cs_chalkboard', B.x, B.y, B.w, B.h)) {        // SPRITE HOOK: frame + board in one image
      ctx.save(); ctx.shadowColor = 'rgba(20,10,0,0.5)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
      rrect(ctx, B.x, B.y, B.w, B.h, 8); ctx.fillStyle = '#5b3a20'; ctx.fill(); ctx.restore();
      const rngw = mulberry32(5); ctx.strokeStyle = 'rgba(30,15,5,0.35)'; ctx.lineWidth = 1;
      for (let i = 0; i < 14; i++) { const yy = B.y + 4 + rngw() * (B.h - 8); ctx.beginPath(); ctx.moveTo(B.x + 2, yy); ctx.lineTo(B.x + 16, yy + 2); ctx.moveTo(B.x + B.w - 16, yy); ctx.lineTo(B.x + B.w - 2, yy + 1); ctx.stroke(); }
      const bg = ctx.createRadialGradient(I.x + I.w / 2, I.y + I.h / 2, 60, I.x + I.w / 2, I.y + I.h / 2, I.w * 0.8);
      bg.addColorStop(0, '#323835'); bg.addColorStop(1, '#202523');
      ctx.fillStyle = bg; ctx.fillRect(I.x, I.y, I.w, I.h);
      const rngc = mulberry32(9);
      for (let i = 0; i < 10; i++) { ctx.fillStyle = 'rgba(239,236,226,0.035)'; ctx.beginPath(); ctx.ellipse(I.x + rngc() * I.w, I.y + rngc() * I.h, 30 + rngc() * 60, 10 + rngc() * 20, rngc() * 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#4a2f1a'; ctx.fillRect(B.x + 30, B.y + B.h - 6, B.w - 60, 10);                // chalk tray
      ctx.fillStyle = CHALK; ctx.fillRect(B.x + 70, B.y + B.h - 9, 26, 5);
    }

    text(ctx, 'CHOOSE YOUR COOK', I.x + 22, I.y + 26, { align: 'left', size: 16, font: DISPLAY_FONT, weight: 'normal', color: 'rgba(239,236,226,0.55)' });
    text(ctx, c.name, I.x + 22, I.y + 62, { align: 'left', size: 34, font: DISPLAY_FONT, weight: 'normal', color: CHALK });
    COOK_STAT_LABELS.forEach(([k, label], i) => {
      const y = I.y + 112 + i * 34;
      text(ctx, `${label}: ${c.stats[k]}`, I.x + 22, y, { align: 'left', size: 22, font: DISPLAY_FONT, weight: 'normal', color: CHALK });
      for (let p = 0; p < 5; p++) {
        ctx.beginPath(); ctx.arc(I.x + 216 + p * 16, y - 2, 5, 0, Math.PI * 2);
        if (p < c.stats[k]) { ctx.fillStyle = CHALK; ctx.fill(); } else { ctx.strokeStyle = 'rgba(239,236,226,0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); }
      }
    });
    text(ctx, `Ability: ${c.ability}`, I.x + 22, I.y + 262, { align: 'left', size: 21, font: DISPLAY_FONT, weight: 'normal', color: '#f4d35e' });
    wrapText(ctx, c.effect, 280, `15px ${FONT}`).forEach((ln, i) =>
      text(ctx, ln, I.x + 22, I.y + 290 + i * 19, { align: 'left', size: 15, color: CHALK }));
    drawCookFull(ctx, c, this.sel, I.x + I.w - 82, I.y + 300, t);
    wrapText(ctx, c.blurb.toUpperCase(), I.w - 60, `19px ${DISPLAY_FONT}`).slice(0, 3).forEach((ln, i) =>
      text(ctx, ln, I.x + I.w / 2, I.y + 362 + i * 26, { size: 19, font: DISPLAY_FONT, weight: 'normal', color: CHALK }));

    // ---- SELECT button ----
    const S = this.selectBtn, sh = inRect(S, m.x, m.y);
    rrect(ctx, S.x, S.y + 5, S.w, S.h, 6); ctx.fillStyle = '#1d4410'; ctx.fill();
    rrect(ctx, S.x, S.y, S.w, S.h, 6);
    const sg = ctx.createLinearGradient(0, S.y, 0, S.y + S.h); sg.addColorStop(0, sh ? '#7cc74a' : '#6ab43a'); sg.addColorStop(1, sh ? '#4f9a2e' : '#3f8424');
    ctx.fillStyle = sg; ctx.fill(); ctx.strokeStyle = '#d7f0b8'; ctx.lineWidth = 2.5; ctx.stroke();
    text(ctx, 'Select This Cook!', S.x + S.w / 2, S.y + S.h / 2 + 3, { size: 30, font: DISPLAY_FONT, weight: 'normal', color: '#fff', stroke: '#1d4410', strokeW: 5 });

    // ---- footer + BACK ----
    text(ctx, 'You can change your cook between shifts', 120, 688, { align: 'left', size: 24, font: DISPLAY_FONT, weight: 'normal', color: '#8e2329', stroke: 'rgba(255,240,220,0.5)', strokeW: 3 });
    const K = this.backBtn, kh = inRect(K, m.x, m.y);
    ctx.save(); ctx.translate(K.x + K.w / 2, K.y + K.h / 2); ctx.rotate(-0.07);
    rrect(ctx, -K.w / 2, -K.h / 2 + 5, K.w, K.h, 6); ctx.fillStyle = '#6e1a0c'; ctx.fill();
    rrect(ctx, -K.w / 2, -K.h / 2, K.w, K.h, 6); ctx.fillStyle = kh ? '#f05a2a' : '#d9441e'; ctx.fill();
    ctx.strokeStyle = '#fff1e0'; ctx.lineWidth = 3; ctx.stroke();
    text(ctx, 'Back', 0, 3, { size: 34, font: DISPLAY_FONT, weight: 'normal', color: '#fff', stroke: '#6e1a0c', strokeW: 5 });
    ctx.restore();
  },
  click(x, y) {
    const i = this.rows.findIndex(r => inRect(r, x, y));
    if (i >= 0) return this.preview(i);
    if (inRect(this.selectBtn, x, y)) { AudioManager.play('click'); return this.confirm(); }
    if (inRect(this.backBtn, x, y)) { AudioManager.play('click'); return this.back(); }
  },
  key(k) {
    if (k === 'ArrowDown' || k === 'ArrowRight') this.preview((this.sel + 1) % COOKS.length);
    else if (k === 'ArrowUp' || k === 'ArrowLeft') this.preview((this.sel + COOKS.length - 1) % COOKS.length);
    else if (k === 'Enter' || k === ' ') this.confirm();
    else if (k === 'Escape' || k === 'Backspace') this.back();
    else if (k >= '1' && k <= String(COOKS.length)) this.preview(Number(k) - 1);
  },
};
