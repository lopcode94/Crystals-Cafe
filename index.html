<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystals Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #110e17; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: pointer; touch-action: none; }

  /* ---- Dev asset-swap sidebar (toggle with the ` key) ---- */
  .dev-panel {
    --dp-bg: #1b1510; --dp-fg: #efe3c4; --dp-muted: #a8977a; --dp-line: #3a2e22;
    --dp-accent: #e0a64a; --dp-ok: #9bd36a; --dp-err: #ff8a6b;
    position: fixed; top: 0; right: 0; height: 100%; width: min(320px, 92vw); box-sizing: border-box;
    display: flex; flex-direction: column; background: var(--dp-bg); color: var(--dp-fg);
    border-left: 2px solid var(--dp-line); box-shadow: -8px 0 24px rgba(0,0,0,0.5);
    font: 13px/1.4 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    transform: translateX(105%); transition: transform 0.18s ease-out; z-index: 10;
  }
  .dev-panel.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { .dev-panel { transition: none; } }
  .dev-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--dp-line); }
  .dev-head h2 { margin: 0; font-size: 15px; letter-spacing: 0.04em; flex: 1; }
  .dev-head kbd { font: 11px ui-monospace, Consolas, monospace; padding: 1px 6px; border: 1px solid var(--dp-line); border-radius: 4px; color: var(--dp-muted); }
  .dev-list { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .dev-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--dp-line); }
  .dev-thumb {
    width: 52px; height: 52px; border-radius: 6px; border: 1px solid var(--dp-line);
    background: repeating-conic-gradient(#2a221a 0% 25%, #342a20 0% 50%) 0 0 / 12px 12px;
    display: grid; place-items: center; overflow: hidden;
  }
  .dev-thumb img { max-width: 100%; max-height: 100%; }
  .dev-thumb span { font-size: 10px; color: var(--dp-muted); }
  .dev-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dev-name { font-weight: bold; }
  .dev-status { font-size: 11px; color: var(--dp-muted); overflow-wrap: anywhere; }
  .dev-status.ok { color: var(--dp-ok); } .dev-status.err { color: var(--dp-err); }
  .dev-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .dev-btn {
    font: inherit; font-size: 12px; color: var(--dp-fg); background: #3a2e22; border: 1px solid #54432f;
    border-radius: 5px; padding: 3px 10px; cursor: pointer;
  }
  .dev-btn:hover { background: #4a3a2a; }
  .dev-btn:focus-visible, .dev-file:focus-within { outline: 2px solid var(--dp-accent); outline-offset: 1px; }
  .dev-btn[disabled] { opacity: 0.4; cursor: default; }
  .dev-file { position: relative; overflow: hidden; }
  .dev-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .dev-foot { padding: 12px 16px; border-top: 1px solid var(--dp-line); display: flex; flex-direction: column; gap: 8px; }
  .dev-foot .dev-btn { background: #6b2a22; border-color: #8a3a2e; padding: 7px 10px; font-size: 13px; }
  .dev-foot .dev-btn:hover { background: #823429; }
  .dev-foot .dev-btn.dev-save { background: #3d6b2a; border-color: #4f8a36; }
  .dev-foot .dev-btn.dev-save:hover { background: #4a7f33; }
  .dev-note { font-size: 11px; color: var(--dp-muted); }
  .dev-layout { padding: 8px 0; border-bottom: 1px solid var(--dp-line); }
  .dev-group > summary {
    cursor: pointer; list-style: none; padding: 8px 4px; font-weight: bold; font-size: 13px; letter-spacing: 0.04em;
    color: var(--dp-accent); border-bottom: 1px solid var(--dp-line);
  }
  .dev-group > summary::before { content: '▸ '; }
  .dev-group[open] > summary::before { content: '▾ '; }
  .dev-group > summary:focus-visible { outline: 2px solid var(--dp-accent); outline-offset: 2px; }
  .dev-size { border: 1px solid var(--dp-line); border-radius: 6px; padding: 4px 8px; }
  .dev-size[hidden] { display: none; }
  .dev-size summary { cursor: pointer; font-size: 12px; color: var(--dp-accent); padding: 2px 0; }
  .dev-size summary:focus-visible { outline: 2px solid var(--dp-accent); outline-offset: 2px; }
  .dev-size[open] { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
  .dev-slider { display: grid; grid-template-columns: 74px 1fr 44px; align-items: center; gap: 6px; font-size: 11px; color: var(--dp-muted); }
  .dev-slider input { width: 100%; min-width: 0; accent-color: var(--dp-accent); }
  .dev-preview {
    display: block; width: 140px; height: 130px; max-width: 100%; align-self: center; border-radius: 6px; border: 1px solid var(--dp-line);
    background: repeating-conic-gradient(#2a221a 0% 25%, #342a20 0% 50%) 0 0 / 14px 14px;
  }
  .dev-slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--dp-fg); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =============================================================================
   CRYSTALS CAFE — Underground Alchemy Lab (time-management arcade prototype)
   -----------------------------------------------------------------------------
   ARCHITECTURE OVERVIEW
     0. Config & math ........ VIEW / ISO projection helpers, utils
     1. EventBus ............. decoupled game events (audio, tutorial, analytics)
     2. AudioManager ......... AUDIO HOOK: drop sound files into SOUND_MAP
     3. Sprites .............. SPRITE HOOK: drop sprite sheets into SPRITE_MANIFEST
     4. Game data ............ RECIPES, STATION_DEFS, CUSTOMER_TYPES, LEVELS, UPGRADES, LAYOUT
     5. RecipeSystem ......... item creation, step progression, what to craft next
     6. Entities ............. Station, Fixture, Booth, Customer
     7. CustomerManager ...... spawning, queue, seating, storm-outs
     8. PlayerController ..... click-queued task list, movement, contextual interactions
     9. ScoreSystem .......... cash, reputation, chain bonuses
    10. Tutorial ............. event-driven hint steps (Shift 1)
    11. World ................ per-shift simulation container
    12. Renderer ............. isometric primitives (placeholder art), HUD
    13. GameState machine .... Title → Intro → Play ⇄ Pause → LevelEnd → Shop → … → Victory
    14. Boot / main loop

   Every prop has its own vector draw function (drawCouch, drawStove, …) listed
   in PROP_DRAWERS. drawProp() swaps in a sprite when ASSETS_LOADED is true and
   the key is in SPRITE_MANIFEST, so you can replace art piece by piece.
   A PostFX pass (grain, dither, scanlines, vignette) runs after every frame; F toggles it.
============================================================================= */

/* ============================== 0. CONFIG ================================== */
const VIEW  = { W: 1280, H: 720 };
const ISO   = { TW: 64, TH: 32, OX: 640, OY: 170 };   // tile size + screen origin of world (0,0)
const WORLD = { W: 14, H: 11 };                        // floor size in tiles
const MAX_TASKS = 5;                                   // Diner-Dash style action queue length
// Handwriting font: "GameUI" is your own font file if you add one (assets/ui-font.ttf, .otf or .woff2, see loadCustomFont);
// otherwise Google Fonts "Covered By Your Grace", a scrawly kid-marker hand. THEME.textScale sizes up interface text.
const FONT = '"GameUI", "Covered By Your Grace", "Permanent Marker", "Comic Sans MS", cursive';

const toScreen = (x, y) => ({ x: ISO.OX + (x - y) * ISO.TW / 2, y: ISO.OY + (x + y) * ISO.TH / 2 });
const toWorld  = (sx, sy) => {
  const a = (sx - ISO.OX) / (ISO.TW / 2), b = (sy - ISO.OY) / (ISO.TH / 2);
  return { x: (a + b) / 2, y: (b - a) / 2 };
};
const P = (x, y, z = 0) => { const s = toScreen(x, y); return { x: s.x, y: s.y - z }; };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
function weightedPick(weights) {
  const entries = Object.entries(weights);
  let r = Math.random() * entries.reduce((s, [, w]) => s + w, 0);
  for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
  return entries[0][0];
}

/* ============================== 1. EVENT BUS =============================== */
const Events = {
  _h: {},
  on(name, fn) {
    (this._h[name] || (this._h[name] = [])).push(fn);
    return () => { this._h[name] = this._h[name].filter(f => f !== fn); };
  },
  emit(name, data) { (this._h[name] || []).slice().forEach(fn => fn(data)); },
};

/* ============================== 2. AUDIO =================================== */
// AUDIO HOOK: set a path for any key, e.g. click: 'assets/sfx/click.ogg'.
// Keys with no file fall back to a tiny synthesized beep so the prototype has feedback.
const SOUND_MAP = {
  click: null, select: null, seat: null, orderTaken: null, pickup: null,
  stationStart: null, stationDone: null, deliver: null, cash: null, chain: null,
  stormOut: null, error: null, levelWin: null, levelLose: null, buy: null,
  overdose: null, siren: null,   // siren plays once per raid; without a file, a two-tone beep alternates
  talk: null,                    // typing blip while cutscene dialogue appears
  heartbeat: null, meltdown: null, fogIn: null, fogOut: null, gurgle: null, kaboom: null,   // chaos systems (section 10c)
  knock: null, fix: null, squeak: null, thud: null, flicker: null, busted: null,
};
// AUDIO HOOK: background music per state, e.g. shift: 'assets/music/shift.mp3'
const MUSIC_MAP = { title: null, shift: null, shop: null };

const BEEPS = {
  click: [660, 0.04], select: [720, 0.06], seat: [520, 0.08], orderTaken: [780, 0.08], pickup: [600, 0.05],
  stationStart: [320, 0.09], stationDone: [900, 0.12], deliver: [990, 0.12], cash: [1250, 0.1], chain: [1400, 0.08],
  stormOut: [140, 0.3], error: [190, 0.08], levelWin: [1040, 0.4], levelLose: [110, 0.5], buy: [1100, 0.1],
  overdose: [90, 0.6], sirenHi: [960, 0.4], sirenLo: [660, 0.4], talk: [300, 0.025],
  heartbeat: [58, 0.16], meltdown: [120, 0.5], fogIn: [240, 0.35], fogOut: [880, 0.15], gurgle: [95, 0.35], kaboom: [70, 0.45],
  knock: [420, 0.05], fix: [1180, 0.12], squeak: [1800, 0.07], thud: [80, 0.25], flicker: [2400, 0.03], busted: [100, 0.8],
};

const AudioManager = {
  muted: false, ctx: null, sfx: {}, music: null,
  init() {
    for (const [k, src] of Object.entries(SOUND_MAP)) {
      if (src) { const a = new Audio(src); a.preload = 'auto'; this.sfx[k] = a; }
    }
  },
  unlock() { // browsers require a user gesture before audio
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  },
  play(name) {
    if (this.muted) return;
    const a = this.sfx[name];
    if (a) { const c = a.cloneNode(); c.volume = 0.7; c.play().catch(() => {}); return; }
    this._beep(name);
  },
  playMusic(key) {
    this.stopMusic();
    const src = MUSIC_MAP[key];
    if (!src || this.muted) return;
    this.music = new Audio(src); this.music.loop = true; this.music.volume = 0.4;
    this.music.play().catch(() => {});
  },
  stopMusic() { if (this.music) { this.music.pause(); this.music = null; } },
  toggleMute() { this.muted = !this.muted; if (this.muted) this.stopMusic(); },
  _beep(name) {
    const b = BEEPS[name]; if (!b || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = b[0];
    g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + b[1]);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + b[1]);
  },
};

// Game events → sounds. Add or change the mapping here and gameplay code doesn't need to change.
const EVENT_SOUNDS = {
  customerSelected: 'select', customerSeated: 'seat', orderTaken: 'orderTaken', itemPicked: 'pickup',
  stationStarted: 'stationStart', stationDone: 'stationDone', delivered: 'deliver', boothCleared: 'cash',
  chain: 'chain', customerStormedOut: 'stormOut', actionError: 'error', upgradeBought: 'buy', overdose: 'overdose', meltdown: "meltdown", busted: "busted",
};
for (const [ev, snd] of Object.entries(EVENT_SOUNDS)) Events.on(ev, () => AudioManager.play(snd));

/* ============================== 3. SPRITES ================================= */
// SPRITE HOOK: register sprite sheets here. Anchor is the feet/base point (0.5, 1 = bottom-center).
// Keys used by the renderer (any key you leave out keeps its vector art):
//   room                                     whole floor + walls (replaces the procedural shell)
//   fridge, stove, counter, cooler, bagging, trash          production props
//   couch, mattress, crate, chair                           seating props
//   player, customer_regular, customer_jittery, customer_bigSpender, customer, cop
//   item_<recipeId>_raw|processing|packed
// Props are anchored bottom-center on the prop's screen bounds (see PROP_SHAPES / propBounds).
// "floor" is a square texture tiled once per floor square, in isometric perspective.
// Example:
//   player: { src: 'assets/player.png', frameW: 64, frameH: 96, frames: 4, fps: 8, anchorX: 0.5, anchorY: 1 },
//   couch:  { src: 'assets/couch.png', anchorX: 0.5, anchorY: 1 },
const SPRITE_MANIFEST = {};

// Flips to true once every image in SPRITE_MANIFEST has loaded. Until then (or with an empty
// manifest) everything is drawn with the vector functions, so there's never a half-loaded frame.
// Sprites uploaded in the dev overlay (` key) are already decoded, so they apply immediately.
let ASSETS_LOADED = false;
const useSprite = key => !!Sprites.custom[key] || !!Sprites.project[key] || (ASSETS_LOADED && Sprites.has(key));
// Animated props: an image for one of these keys that is wide enough to hold the frames side by side (equal widths)
// is played as a sprite sheet, and only while the station is working; otherwise it shows frame 1.
// A single still uploaded for the same key just shows as a still.
const SPRITE_SHEETS = { cooler: { frames: 3, fps: 14, fit: 2.2 } };   // cooler = the spinning fan (assets/cooler.png); fit = default size vs the footprint
const sheetDef = (key, img, def) => { const s = SPRITE_SHEETS[key]; return s && img.width >= img.height * s.frames * 0.6 ? { ...def, ...s } : def; };

// Per-item color from the dev panel's "Color" sliders: hue (degrees), saturation and brightness (%).
// Pixels are recolored directly with the same color math as CSS hue-rotate/saturate/brightness (canvas
// `filter` is avoided on purpose: it is slow or unreliable in some browsers). Works on uploaded images and
// on the built-in drawings alike.
function colorFilter(key) {   // a string that identifies the current setting ('' = no change)
  const t = spriteTweaks(key), h = t.hue || 0, s = t.sat ?? 100, b = t.bright ?? 100;
  return h || s !== 100 || b !== 100 ? `${h}|${s}|${b}` : '';
}
function colorMatrix(key) {
  const t = spriteTweaks(key), th = (t.hue || 0) * Math.PI / 180, s = (t.sat ?? 100) / 100, br = (t.bright ?? 100) / 100;
  const c = Math.cos(th), n = Math.sin(th);
  const H = [0.213 + c * 0.787 - n * 0.213, 0.715 - c * 0.715 - n * 0.715, 0.072 - c * 0.072 + n * 0.928,
             0.213 - c * 0.213 + n * 0.143, 0.715 + c * 0.285 + n * 0.140, 0.072 - c * 0.072 - n * 0.283,
             0.213 - c * 0.213 - n * 0.787, 0.715 - c * 0.715 + n * 0.715, 0.072 + c * 0.928 + n * 0.072];
  const S = [0.213 + 0.787 * s, 0.715 - 0.715 * s, 0.072 - 0.072 * s,
             0.213 - 0.213 * s, 0.715 + 0.285 * s, 0.072 - 0.072 * s,
             0.213 - 0.213 * s, 0.715 - 0.715 * s, 0.072 + 0.928 * s];
  const M = new Array(9);                                         // brightness · saturate · hue-rotate
  for (let r = 0; r < 3; r++) for (let k = 0; k < 3; k++) M[r * 3 + k] = br * (S[r * 3] * H[k] + S[r * 3 + 1] * H[3 + k] + S[r * 3 + 2] * H[6 + k]);
  return M;
}
function recolorPixels(g, w, h, M) {
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    if (!p[i + 3]) continue;
    const r = p[i], gg = p[i + 1], b = p[i + 2];
    p[i] = M[0] * r + M[1] * gg + M[2] * b; p[i + 1] = M[3] * r + M[4] * gg + M[5] * b; p[i + 2] = M[6] * r + M[7] * gg + M[8] * b;
  }
  g.putImageData(d, 0, 0);
}
// Uploaded images: a recolored copy is made once per color setting (filtering every frame is slow).
const TintCache = new Map();
const _imgIds = new WeakMap(); let _imgNext = 1;
const imgId = img => _imgIds.get(img) || (_imgIds.set(img, _imgNext), _imgNext++);   // stable id per image/canvas
function tintedImg(key, img) {
  const f = colorFilter(key); if (!f || !img) return img;
  const hit = TintCache.get(key);
  if (hit && hit.src === img && hit.f === f) return hit.canvas;
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  try { recolorPixels(g, c.width, c.height, colorMatrix(key)); } catch (e) { return img; }   // e.g. a cross-origin image
  TintCache.set(key, { src: img, f, canvas: c });
  return c;
}
// Built-in (vector) art: drawn normally into a scratch canvas covering just its area (b, in the current
// drawing units), then composited once through the filter. fn receives the context to draw on.
// Scratch canvases are stacked so nested calls stay correct.
const ScratchStack = [];
function withColor(ctx, key, fn, b) {
  const f = colorFilter(key); if (!f) return fn(ctx);
  const m = ctx.getTransform(), CW = ctx.canvas.width, CH = ctx.canvas.height;
  let X0 = 0, Y0 = 0, X1 = CW, Y1 = CH;
  if (b) {
    const xs = [], ys = [];
    for (const [px, py] of [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]]) { xs.push(m.a * px + m.c * py + m.e); ys.push(m.b * px + m.d * py + m.f); }
    X0 = Math.max(0, Math.floor(Math.min(...xs)) - 4); Y0 = Math.max(0, Math.floor(Math.min(...ys)) - 4);
    X1 = Math.min(CW, Math.ceil(Math.max(...xs)) + 4); Y1 = Math.min(CH, Math.ceil(Math.max(...ys)) + 4);
  }
  const W = X1 - X0, H = Y1 - Y0;
  if (W <= 0 || H <= 0) return fn(ctx);                         // off screen: nothing to recolor
  const depth = withColor.depth = (withColor.depth || 0) + 1;
  let sc = ScratchStack[depth - 1];
  if (!sc || sc.width < W || sc.height < H) { sc = ScratchStack[depth - 1] = document.createElement('canvas'); sc.width = Math.max(W, sc ? sc.width : 0); sc.height = Math.max(H, sc ? sc.height : 0); }
  const g = sc.getContext('2d', { willReadFrequently: true });
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.setTransform(m.a, m.b, m.c, m.d, m.e - X0, m.f - Y0); g.globalAlpha = 1;
  try {
    const r = fn(g);
    g.setTransform(1, 0, 0, 1, 0, 0); recolorPixels(g, W, H, colorMatrix(key));
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sc, 0, 0, W, H, X0, Y0, W, H); ctx.restore();
    return r;
  } finally { withColor.depth--; }
}

const Sprites = {
  store: {},    // from SPRITE_MANIFEST
  custom: {},   // from the dev overlay; overrides store entries with the same key
  tweaks: {},   // per-key { scale, x, y } from the dev overlay's size sliders (y > 0 moves up)
  project: {},  // saved to the project with "Save to project" (cook-dash/assets/), loaded from assets/sprites.json
  entry(key) { return this.custom[key] || this.project[key] || this.store[key]; },
  load() {
    const entries = Object.entries(SPRITE_MANIFEST);
    let pending = entries.length;
    for (const [key, def] of entries) {
      const img = new Image();
      const entry = { def, img, ready: false };
      const settle = ok => {
        entry.ready = ok;
        if (!ok) console.warn(`Sprite "${key}" failed to load from ${def.src}; using vector art.`);
        if (--pending === 0) { ASSETS_LOADED = true; StaticLayer.invalidate(); }
      };
      img.onload = () => settle(true);
      img.onerror = () => settle(false);
      img.src = def.src;
      this.store[key] = entry;
    }
  },
  has(key) { const s = this.entry(key); return !!(s && s.ready); },
  // Draws the frame for time t (seconds) anchored at screen (x, y).
  // Sprites with def.autoFit (dev uploads) scale to fitW / fitH so any image size lines up.
  draw(ctx, key, x, y, { t = 0, frame = null, scale = 1, flip = false, alpha = 1, fitW = 0, fitH = 0 } = {}) {
    const { def, img } = this.entry(key);
    const frames = def.frames || 1;
    const fw = def.frameW || img.width / frames, fh = def.frameH || img.height;
    const f = frame != null ? frame % frames : Math.floor(t * (def.fps || 8)) % frames;
    if (def.autoFit) scale *= (fitW ? fitW / fw : fitH ? fitH / fh : 1) * (def.fit || 1);
    const tw = this.tweaks[key];   // size/position set with the dev panel's "Adjust size" sliders
    if (tw) { scale *= tw.scale ?? 1; x += tw.x || 0; y -= tw.y || 0; }
    const w = fw * scale, h = fh * scale;
    ctx.save(); ctx.globalAlpha = alpha;
    // (dev-panel Color sliders: img below is the recolored copy)
    ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(tintedImg(key, img), f * fw, 0, fw, fh, -w * (def.anchorX ?? 0.5), -h * (def.anchorY ?? 1), w, h);
    ctx.restore();
  },
};

/* ============================== 4. GAME DATA =============================== */
const STATION_ORDER = ['heat', 'mix', 'cool', 'package'];
const STATION_DEFS = {
  heat:    { name: 'Stove',   verb: 'Heat',  time: 4.0, prop: 'stove',   upgrade: 'burner'  },
  mix:     { name: 'Mixer',   verb: 'Mix',   time: 3.0, prop: 'counter', upgrade: 'mixer'   },

/* ============================== 5. RECIPE SYSTEM =========================== */
let _itemId = 1;
const RecipeSystem = {
  createItem(recipe) { return { id: _itemId++, recipe, step: 0 }; },
  nextStep(item)     { return RECIPES[item.recipe].steps[item.step] || null; },
  isFinished(item)   { return item.step >= RECIPES[item.recipe].steps.length; },
  stage(item)        { return item.step === 0 ? 'raw' : this.isFinished(item) ? 'packed' : 'processing'; },
  stepsLabel(recipe) { return RECIPES[recipe].steps.map(s => STATION_DEFS[s].name).join(' → '); },
  // The supply shelf hands out ingredients for the oldest order that doesn't already have an item in progress.
  nextRecipeToStart(world) {
    const waiting = world.customers.list
      .filter(c => c.hasOrder)
      .sort((a, b) => a.orderTime - b.orderTime);
    const inProgress = {};
    for (const it of world.allItems()) inProgress[it.recipe] = (inProgress[it.recipe] || 0) + 1;
    for (const c of waiting) {
      if (inProgress[c.recipe] > 0) inProgress[c.recipe]--;
      else return c.recipe;
    }
    return null;
  },
};

/* ============================== 6. ENTITIES ================================ */
class Station {
  constructor(type, locked) {
    this.kind = 'station'; this.type = type; this.def = STATION_DEFS[type];
    this.x = LAYOUT.stationX[type]; this.y = LAYOUT.benchY;
    this.state = locked ? 'locked' : 'idle';   // locked | idle | working | done
    this.item = null; this.progress = 0; this.duration = 1; this.hit = null;
    this.wear = 0; this.broken = false; this.powerOut = 0; this.stall = 0; this.w = null;   // equipment wear (section 10c)
  }
  get depth() { return this.x + this.y; }
  servicePoint() { return { x: this.x, y: LAYOUT.serviceY }; }
  start(item, duration) {
    this.item = item; this.duration = duration; this.progress = 0; this.state = 'working';
    stationOnStart(this);
    Events.emit('stationStarted', { type: this.type, item });
  }
  take() { const it = this.item; this.item = null; this.state = 'idle'; return it; }
  update(dt) {
    if (this.powerOut > 0) { this.powerOut = Math.max(0, this.powerOut - dt); return; }   // no power: everything pauses
    if (this.state !== 'working') return;
    if (this.stall > 0) { this.stall -= dt; return; }                                     // malfunction stall
    this.progress += dt / this.duration;
    if (this.progress >= 1) {
      this.progress = 1; this.item.step++; this.state = "done";
      Events.emit("stationDone", { type: this.type });
      stationOnDone(this);
    }
    // TODO hook: an "overcook" timer could start here for done items on later levels.
  }
}

class Fixture { // supply shelf and trash can
  constructor(kind, x) { this.kind = kind; this.x = x; this.y = LAYOUT.benchY; this.hit = null; }
  get depth() { return this.x + this.y; }
  servicePoint() { return { x: this.x, y: LAYOUT.serviceY }; }
}

class Booth {
  constructor(index, pos) {
    this.kind = 'booth'; this.index = index; this.x = pos.x; this.y = pos.y;
    this.type = SEAT_TYPES[index % SEAT_TYPES.length]; this.def = SEAT_DEFS[this.type];
    this.state = 'empty';   // empty | occupied | dirty
    this.customer = null; this.cash = 0; this.hit = null;
  }
  get depth() { return this.x + this.y - 0.2; }   // just behind the seated customer
  get seatPos() { return { x: this.x + this.def.seat.dx, y: this.y + this.def.seat.dy }; }
  servicePoint() { return { x: this.x + this.def.service.dx, y: this.y + this.def.service.dy }; }
  clear() { this.state = 'empty'; this.cash = 0; this.customer = null; }
}

const CS = {
  ENTERING: 'entering', QUEUED: 'queued', WALK_TO_BOOTH: 'walkToBooth', BROWSING: 'browsing',
  READY_TO_ORDER: 'readyToOrder', WAITING: 'waiting', SAMPLING: 'sampling',
  LEAVING: 'leaving', STORMING: 'storming', GONE: 'gone',
  OVERDOSED: 'overdosed', CARRIED: 'carried',   // served too soon; handled by RaidSystem
  TO_BATH: "toBath", BATH_LINE: "bathLine", IN_BATH: "inBath", FROM_BATH: "fromBath",   // bathroom trips (section 10c)
  LINGER: "linger",                                 // finished but won't leave (event)
};
const SKIN = ['#f1c7a3', '#d9a07a', '#a86b4a', '#6e4630', '#f5d6c6'];
const HAIR = ['#2b1d14', '#6b3e1e', '#d8b24a', '#1c1c1c', '#a33b2b', '#7d7d7d'];

class Customer {
  constructor(id, typeKey, recipe, world) {
    this.kind = 'customer'; this.id = id; this.w = world;
    this.typeKey = typeKey; this.type = CUSTOMER_TYPES[typeKey]; this.recipe = recipe;
    this.x = LAYOUT.door.x; this.y = LAYOUT.door.y; this.path = [];
    this.speed = 2.6; this.state = CS.ENTERING; this.timer = 0;
    this.maxPatience = 100 * this.type.patienceMul; this.patience = this.maxPatience;
    this.booth = null; this.queueIndex = -1; this.orderTime = 0; this.tipFrac = 0;
    this.anim = Math.random() * 10; this.facing = 1; this.hit = null;
    this.skin = pick(SKIN); this.hair = pick(HAIR);
    this.setPersona(world.levelIndex == null ? "normal" : rollPersonality(world));
  }
  setPersona(key) {   // personality layer (section 10c): scales patience; drain, tips, timing are applied where they happen
    const frac = this.patienceFrac;
    this.personaKey = key; this.persona = PERSONALITIES[key];
    this.maxPatience = 100 * this.type.patienceMul * this.persona.patienceMul; this.patience = this.maxPatience * frac;
  }
  get present() { return ![CS.LEAVING, CS.STORMING, CS.GONE, CS.OVERDOSED, CS.CARRIED].includes(this.state); }
  get depth() { return this.x + this.y; }
  get seated() { return [CS.BROWSING, CS.READY_TO_ORDER, CS.WAITING, CS.SAMPLING, CS.LINGER].includes(this.state); }
  get patienceFrac() { return this.patience / this.maxPatience; }
  // has an order out (including while away at the bathroom, section 10c)
  get hasOrder() { return [CS.WAITING, CS.TO_BATH, CS.BATH_LINE, CS.IN_BATH, CS.FROM_BATH].includes(this.state); }
  walkTo(points) { this.path = points.map(p => ({ x: p.x, y: p.y })); }
  addPatience(n) { this.patience = Math.min(this.maxPatience, this.patience + n); }

  update(dt) {
    this.anim += dt;
    if (this.action && (this.action.t += dt) > ACTIONS[this.action.type].dur) this.action = null;
    const moving = this._move(dt);
    updateCustomerMood(this, dt); maybeChangeOrder(this);
    updateLookalike(this, dt);
    if (this.arguing > 0 && (this.arguing -= dt) <= 0) {   // argument burned out on its own
      this.arguing = 0; if (this.argueWith && !this.argueWith.arguing) this.w.suspicion.add(CHAOS_CONFIG.suspicion.gain.argumentUnresolved);
    }
    const rate = this.state === CS.BATH_LINE ? CHAOS_CONFIG.bathroom.lineDecay : PATIENCE_DECAY[this.state] || 0;
    if (rate > 0) {
      this.patience -= rate * this.w.patienceDecayMul() * chaosPatienceMul(this.w, this) * dt;
      if (this.patience <= 0) { this.patience = 0; this.stormOut(); return; }
    }
    switch (this.state) {
      case CS.ENTERING:      if (!moving) this.state = CS.QUEUED; break;
      case CS.WALK_TO_BOOTH: if (!moving) { this.state = CS.BROWSING; this.timer = rand(...this.w.level.browse) * this.persona.browseMul; } break;
      case CS.BROWSING:
        if ((this.timer -= dt) <= 0) { this.state = CS.READY_TO_ORDER; Events.emit('customerReady', { customer: this }); }
        break;
      case CS.SAMPLING:
        if ((this.timer -= dt) <= 0) {
          if (this.willLinger) { this.state = CS.LINGER; this.lingerT = CHAOS_CONFIG.lingerTime; this.w.say(pick(['Five more minutes.', 'I live here now.', 'Just one more song.']), this, '#efe3c4', -18); }
          else this.finish();
        }
        break;
      case CS.LINGER:   // won't leave (event): the cook escorts them out, or they finally go on their own
        if ((this.lingerT -= dt) <= 0) { this.w.suspicion.add(CHAOS_CONFIG.suspicion.gain.lingerUnresolved); this.finish(); }
        break;
      case CS.WAITING:   // sometimes they need the bathroom (section 10c)
        if (!this.wentBath && Math.random() < CHAOS_CONFIG.bathroom.needChancePerSec * this.persona.bathroomMul * dt) this.w.bathroom.request(this);
        break;
      case CS.TO_BATH:   if (!moving) this.state = CS.BATH_LINE; break;
      case CS.FROM_BATH: if (!moving) this.state = CS.WAITING; break;
      case CS.LEAVING:
      case CS.STORMING:      if (!moving) this.state = CS.GONE; break;
    }
  }
  _move(dt) {
    if (!this.path.length) return false;
    const t = this.path[0], dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy);
    const step = this.speed * dt * (this.state === CS.STORMING ? 1.8 : 1);
    if (Math.abs(dx - dy) > 0.01) this.facing = dx - dy > 0 ? 1 : -1;
    if (d <= step) { this.x = t.x; this.y = t.y; this.path.shift(); return this.path.length > 0; }
    this.x += dx / d * step; this.y += dy / d * step;
    return true;
  }
  takeOrder() {
    this.state = CS.WAITING; this.orderTime = this.w.time; this.addPatience(15);
    if (this.persona.changeOrder && Math.random() < this.persona.changeOrder) this.changeAt = this.w.time + rand(...CHAOS_CONFIG.personality.indecisiveChangeWindow);
    Events.emit('orderTaken', { customer: this });
  }
  // Seconds left before this order is safe to serve. Serving while > 0 causes an overdose.
  get waitLeft() { return this.hasOrder ? Math.max(0, this.w.level.minWait - (this.w.time - this.orderTime)) : 0; }
  serve() {
    this.tipFrac = this.patienceFrac; this.state = CS.SAMPLING; this.timer = rand(...this.w.level.sample);
    this.action = { type: 'cheer', t: 0 };   // hop + arms up + star halo
    { const L = CHAOS_CONFIG.suspicion.loss;   // good service calms things down
      this.w.suspicion.add(-(L.served + (this.patienceFrac > 0.6 ? L.servedHappy : 0) + (RECIPES[this.recipe].steps.length >= 4 ? L.hardOrder : 0)));
      this.w.stress.add(-CHAOS_CONFIG.stress.deliverDrop); }
    Events.emit('delivered', { customer: this });
  }
  finish() {
    const price = RECIPES[this.recipe].price;
    const b = this.booth;
    b.cash = Math.round(price + price * this.tipFrac * this.type.tipMul * this.persona.tipMul * this.w.cook.tipMul);
    b.state = "dirty"; b.dirtySince = this.w.time; b.customer = null; this.booth = null;
    this.w.score.onPaid();
    this.state = CS.LEAVING; this.walkTo([LAYOUT.door]);
    personalityOnPaid(this, b);
    resolveLookalike(this, b, false);
    Events.emit('customerPaid', { customer: this, booth: b });
  }
  // reason: 'impatient' (patience ran out) or 'scared' (fleeing a police raid). Both count as walkouts.
  stormOut(reason = 'impatient') {
    this.w.bathroom.remove(this);
    if (this.booth) { this.booth.clear(); this.booth = null; }
    if (this.w.selected === this) this.w.selected = null;
    this.queueIndex = -1; this.scared = reason === 'scared';
    this.state = CS.STORMING; this.walkTo([LAYOUT.door]);
    this.w.score.onStormOut(this, this.scared ? 'Fled!' : 'Stormed out!', !this.scared || RAID.fleePenalty);
    if (!this.scared) { this.w.suspicion.add(CHAOS_CONFIG.suspicion.gain.stormOut * this.persona.suspicionMul, this); this.w.stress.add(CHAOS_CONFIG.stress.stormOut); }
    if (!this.scared && this.persona.mystery) resolveMystery(this, this, true);
    if (this.lookalike) resolveLookalike(this, this, !this.scared);
    Events.emit('customerStormedOut', { customer: this, reason });
  }
}

/* ============================== 7. CUSTOMER MANAGER ======================== */
class CustomerManager {
  constructor(world) {
    this.w = world; this.list = []; this.spawned = 0; this.nextId = 1;
    this.spawnTimer = world.level.firstSpawn;
  }
  get queue() {
    return this.list.filter(c => c.state === CS.ENTERING || c.state === CS.QUEUED)
                    .sort((a, b) => a.queueIndex - b.queueIndex);
  }
  get remaining() { return this.w.level.customers - this.spawned + this.list.filter(c => !c.extra && c.state !== CS.LEAVING && c.state !== CS.STORMING).length; }
  update(dt) {
    const L = this.w.level;
    if (this.spawned < L.customers) {
      const gated = this.w.tutorial && !this.w.tutorial.allowSpawns() && this.spawned >= 1;
      if (!gated && !this.w.raid.active) this.spawnTimer -= dt;   // nobody walks in during a raid
      if (this.spawnTimer <= 0 && this.queue.length < LAYOUT.queue.length) {
        this.spawn();
        this.spawnTimer = rand(...L.spawnInterval);
      }
    }
    for (const c of this.list) c.update(dt);
    this.list = this.list.filter(c => c.state !== CS.GONE);
    this.reindexQueue();
  }
  spawn() {
    const L = this.w.level;
    const c = new Customer(this.nextId++, weightedPick(L.customerTypes), pick(L.recipes), this.w);
    c.queueIndex = this.queue.length;
    c.walkTo([LAYOUT.queue[c.queueIndex]]);
    this.list.push(c); this.spawned++;
    Events.emit('customerArrived', { customer: c });
  }
  reindexQueue() {
    this.queue.forEach((c, i) => {
      if (c.queueIndex !== i) { c.queueIndex = i; c.walkTo([LAYOUT.queue[i]]); }
    });
  }
  seat(c, booth) {
    booth.customer = c; booth.state = 'occupied';
    c.booth = booth; c.queueIndex = -1; c.state = CS.WALK_TO_BOOTH;
    c.walkTo([booth.seatPos]); c.addPatience(20);
    if (this.w.selected === c) this.w.selected = null;
    this.reindexQueue();
    Events.emit('customerSeated', { customer: c, booth });
  }
}

/* ============================== 8. PLAYER CONTROLLER ======================= */
class PlayerController {
  constructor(world) {
    this.w = world; this.x = LAYOUT.playerStart.x; this.y = LAYOUT.playerStart.y;
    this.hands = [null, null];   // two-handed carry, Diner Dash style
    this.tasks = [];             // queued {target, point}
    this.baseSpeed = 4.2; this.busy = 0; this.anim = 0; this.moving = false; this.facing = 1;
    this.action = null;          // { type: 'grab' | 'place', t } drives the reach animation
  }
  act(type) { this.action = { type, t: 0 }; Events.emit('playerAction', { type }); }
  // Timed jobs (repairs, cleaning, meltdowns): the cook stands still under a progress bar, then onDone runs.
  doJob(label, dur, onDone, o = {}) { this.busy = dur; this.job = { label, dur, t: 0, onDone, melt: !!o.melt }; }
  get melting() { return !!(this.job && this.job.melt); }
  get depth() { return this.x + this.y; }
  get speed() { return this.baseSpeed * (1 + 0.2 * (this.w.up.sneakers || 0)) * this.w.cook.moveMul; }

  enqueue(target) {
    if (this.tasks.length >= MAX_TASKS) { this.w.say('Action queue full!', this, '#ff8a80'); Events.emit('actionError'); return false; }
    this.tasks.push({ target, point: target.servicePoint() });
    Events.emit('taskQueued', { target });
    return true;
  }
  update(dt) {
    this.anim += dt; this.moving = false;
    if (this.action && (this.action.t += dt) > ACTIONS[this.action.type].dur) this.action = null;
    if (this.busy > 0) {
      this.busy -= dt;
      if (this.job) { this.job.t += dt; if (this.busy <= 0) { const j = this.job; this.job = null; if (j.onDone) j.onDone(); } }
      return;
    }
    const t = this.tasks[0]; if (!t) return;
    const dx = t.point.x - this.x, dy = t.point.y - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (Math.abs(dx - dy) > 0.01) this.facing = dx - dy > 0 ? 1 : -1;
    // which way she faces on screen (cutout-rig cooks): screen x ~ dx - dy, screen y ~ (dx + dy) / 2
    const sx = dx - dy, sy = (dx + dy) / 2;
    this.view = Math.abs(sy) > Math.abs(sx) * 1.2 ? (sy > 0 ? "front" : "back") : "side";
    if (d > step) { this.x += dx / d * step; this.y += dy / d * step; this.moving = true; return; }
    this.x = t.point.x; this.y = t.point.y; this.tasks.shift();
    if (t.target.kind !== 'floor') { this.busy = 0.18; this.interact(t.target); }
  }

  // Contextual interaction, resolved on arrival (world state may have changed since the click).
  interact(t) {
    switch (t.kind) {
      case 'supply':  return this._useSupply();
      case 'station': return this._useStation(t);
      case 'booth':   return this._useBooth(t);
      case 'trash':   return this._useTrash();
      case "bathroom": { const j = this.w.bathroom.job(); return this.doJob(j.label, j.time, j.done); }
      case "mess":     return this._cleanMess(t);
      case 'critter':  return (w => { if (!w.critters.includes(t) || t.fleeing) return; if (Math.hypot(t.x - this.x, t.y - this.y) > CHAOS_CONFIG.critters.shooRadius) return this._fail('It got away!');
                          this.doJob('Shoo!', CHAOS_CONFIG.critters.shooTime, () => t.flee(true)); })(this.w);
      case 'bag':      return this.doJob(t.box ? 'Opening...' : 'Inspecting...', 1.2, () => resolveBag(this.w, t));
    }
  }
  _freeHand() { return this.hands.indexOf(null); }
  _fail(msg) { this.w.say(msg, this, "#ff8a80"); Events.emit("actionError"); this.w.stress.add(CHAOS_CONFIG.stress.actionError); }

  _useSupply() {
    if (this.w.supply.stuck) return this.doJob('Slamming the freezer...', 0.8, () => { this.w.supply.stuck = false; this.w.say('*SLAM*', this.w.supply.servicePoint(), '#9bd36a'); });   // Used Freezer (section 10c)
    const h = this._freeHand(); if (h < 0) return this._fail('Hands full!');
    const r = RecipeSystem.nextRecipeToStart(this.w); if (!r) return this._fail('No open orders');
    this.hands[h] = RecipeSystem.createItem(r); this.act('grab');
    if (this.w.up.usedFreezer && this._freeHand() >= 0) { const r2 = RecipeSystem.nextRecipeToStart(this.w); if (r2) this.hands[this._freeHand()] = RecipeSystem.createItem(r2); }   // Used Freezer
    this.w.say(`${RECIPES[r].name} reagents`, this, RECIPES[r].color);
    Events.emit('itemPicked', { source: 'supply', recipe: r });
  }
  _useStation(st) {
    if (st.state === "locked") return this._fail("Locked — unlocks later");
    const E = CHAOS_CONFIG.equipment;   // section 10c: power cuts, broken gear
    if (st.powerOut > 0) return this.doJob('Jiggling the plug...', E.plugJiggleTime, () => { st.powerOut = 0; this.w.say("Power's back!", st.servicePoint(), '#9bd36a'); this.w.suspicion.add(-CHAOS_CONFIG.suspicion.loss.resolveEvent); });
    if (st.broken && st.state !== 'done') return this.doJob(`Fixing the ${st.def.name}...`, E.emergencyRepairTime, () => {
      st.broken = false; st.wear = E.emergencyRepairTo; AudioManager.play('fix');
      this.w.say('Patched up. Sort of.', st.servicePoint(), '#9bd36a'); this.w.suspicion.add(-CHAOS_CONFIG.suspicion.loss.repair); this.w.stress.add(-CHAOS_CONFIG.stress.cleanDrop);
    });
    let acted = false;
    if (st.state === 'done') {
      const h = this._freeHand();
      if (h >= 0) { this.hands[h] = st.take(); acted = true; this.act('grab'); Events.emit('itemPicked', { source: st.type }); }
      else return this._fail('Hands full!');
    }
    if (st.state === 'idle' && !st.broken) {
      const h = this.hands.findIndex(it => it && RecipeSystem.nextStep(it) === st.type);
      if (h >= 0) { st.start(this.hands[h], this.w.stationTime(st.type)); this.hands[h] = null; acted = true; this.act('place'); }
    }
    if (!acted) {
      if (st.state === 'working') this._fail('Still working…');
      else if (this.hands.some(Boolean)) this._fail("Wrong step!");
      else if (st.state === 'idle' && stationCondition(st) !== 'good') this.doJob('Tune-up...', CHAOS_CONFIG.equipment.tuneUpTime, () => { st.wear = Math.max(0, st.wear - CHAOS_CONFIG.equipment.tuneUpBy); this.w.say('Runs better.', st.servicePoint(), '#9bd36a'); });
      else this._fail(`Nothing to ${st.def.verb.toLowerCase()}`);
    }
  }
  _useBooth(b) {
    const X = CHAOS_CONFIG;   // section 10c: collapsed seats, arguments, customers who won't leave
    if (b.broken && !b.customer && b.state !== 'dirty') return this.doJob('Fixing the seat...', X.chairFixTime, () => { b.broken = false; AudioManager.play('fix'); this.w.say('Good as new-ish.', b, '#9bd36a'); this.w.suspicion.add(-X.suspicion.loss.repair); });
    if (b.customer && b.customer.arguing > 0) return this.doJob('Calm down!', X.calmJobTime, () => {
      const c = b.customer; if (!c) return; const o = c.argueWith; c.arguing = 0; if (o) o.arguing = 0;
      this.w.say(pick(['Fine.', 'Whatever.', '...sorry.']), c, '#9bd36a', -18); this.w.suspicion.add(-X.suspicion.loss.resolveEvent);
    });
    if (b.customer && b.customer.state === CS.LINGER) return this.doJob('Escorting out...', X.escortTime, () => {
      const c = b.customer; if (c && c.state === CS.LINGER) { c.finish(); this.w.suspicion.add(-X.suspicion.loss.resolveEvent * 0.5); }
    });
    if (b.state === 'dirty') {
      const cash = b.cash; b.clear(); this.act('grab');
      this.w.score.addCash(cash);
      this.w.say(`+$${cash}`, b, '#7ee787');
      this.w.score.action('clear', b);
      this.w.suspicion.add(-CHAOS_CONFIG.suspicion.loss.boothCleared);
      Events.emit('boothCleared', { booth: b, cash });
      return;
    }
    const c = b.customer;
    if (!c) return this._fail('Empty booth');
    if (c.state === CS.READY_TO_ORDER) {
      c.takeOrder(); this.act("grab"); this.w.score.action("order", b);
      if (c.persona.orderTime > 0) this.doJob(c.personaKey === "talker" ? "Yap yap yap..." : "Taking order...", c.persona.orderTime);
    } else if (c.state === CS.WAITING) {
      const h = this.hands.findIndex(it => it && RecipeSystem.isFinished(it) && it.recipe === c.recipe);
      if (h < 0) {
        const any = this.w.memory.active ? this.hands.findIndex(it => it && RecipeSystem.isFinished(it)) : -1;   // brain fog: wrong bag handed over
        if (any >= 0) { this.hands[any] = null; this.act('place'); return serveWrongOrder(this.w, c); }
        return this._fail(this.w.memory.active ? 'Wants... something?' : `Wants ${RECIPES[c.recipe].name}`);
      }
      this.hands[h] = null; this.act('place');
      if (c.waitLeft > 0) return this.w.raid.trigger(c);   // served too soon: overdose + police raid
      c.serve(); this.w.score.action('deliver', b);
      memoryBonus(this.w, c, b);
    } else if (c.state === CS.BROWSING || c.state === CS.WALK_TO_BOOTH) {
      this._fail('Still deciding…');
    } else if (c.state === CS.OVERDOSED) {
      this._fail('Too late for that…');
    } else if (c.state === CS.TO_BATH || c.state === CS.BATH_LINE || c.state === CS.IN_BATH || c.state === CS.FROM_BATH) {
      this._fail("They're in the bathroom!");
    }
  }
  _cleanMess(m) {   // section 10c
    if (!this.w.messes.includes(m)) return;
    const slow = this.w.bathroom.problems.sinkBroken ? CHAOS_CONFIG.messes.sinkBrokenMul : 1;
    this.doJob(slow > 1 ? "Mopping (no sink!)..." : "Mopping...", CHAOS_CONFIG.messes.cleanTime * slow, () => {
      const w = this.w; if (!w.messes.includes(m)) return;
      w.messes = w.messes.filter(x => x !== m); w.suspicion.add(-CHAOS_CONFIG.suspicion.loss.cleanMess); w.stress.add(-CHAOS_CONFIG.stress.cleanDrop);
      w.say("Clean!", m, "#9bd36a"); Events.emit("messCleaned");
    });
  }
  _useTrash() {
    if (!this.hands.some(Boolean)) return this._fail('Nothing to toss');
    this.hands = [null, null]; this.act('place');
    this.w.say('Tossed', this, '#bbb');
    Events.emit('itemTrashed');
  }
}

/* ============================== 9. SCORE SYSTEM ============================ */
class ScoreSystem {
  constructor(world) {
    this.w = world; this.cash = 0; this.rep = 60; this.served = 0; this.stormed = 0;
    this.lastAction = null; this.chain = 0;
  }
  addCash(n) { this.cash = Math.max(0, this.cash + n); }
  // Same action repeated back-to-back builds a chain bonus (Diner Dash's signature combo mechanic).
  action(kind, at) {
    if (kind === this.lastAction) {
      this.chain++;
      const bonus = this.chain * 2;
      this.cash += bonus;
      this.w.say(`Chain x${this.chain + 1}  +$${bonus}`, at, '#ffd166', -22);
      Events.emit('chain', { kind, chain: this.chain });
      this.w.stress.add(-CHAOS_CONFIG.stress.chainDrop);
    } else { this.lastAction = kind; this.chain = 0; }
  }
  onPaid() { this.served++; this.rep = Math.min(100, this.rep + 4); }
  // penalize=false still counts the customer as lost (stormed) but skips the rep/cash hit.
  onStormOut(c, label = 'Stormed out!', penalize = true) {
    this.stormed++;
    if (!penalize) { this.w.say(label, c, '#9fd8ff'); return; }
    this.rep = Math.max(0, this.rep - 15); this.addCash(-10);
    this.w.say(`${label}  -$10`, c, '#ff6b6b');
  }
}

/* ============================== 10. TUTORIAL =============================== */
// Steps advance on events. If the player skips ahead, it jumps to the matching later step.
const TUTORIAL_STEPS = [
  { text: 'A customer is waiting by the door. Click them to select.', event: 'customerSelected',
    target: w => w.customers.queue[0] },
  { text: 'Now click an empty seat (couch or mattress) to seat them.', event: 'customerSeated',
    target: w => w.booths.find(b => b.state === 'empty') },
  { text: 'When the "!" pops up, click them to take the order.', event: 'orderTaken',
    target: w => w.booths.find(b => b.customer && b.customer.state === CS.READY_TO_ORDER) },
  { text: 'Click the FRIDGE to grab supplies for the order.', event: 'itemPicked', filter: d => d.source === 'supply',
    target: w => w.supply },
  { text: 'Blue Ice = Stove → Mixer → Bagging. Click the STOVE.', event: 'stationStarted', filter: d => d.type === 'heat',
    target: w => w.station('heat') },
  { text: 'When the Stove dings, click it to collect, then click the MIXER.', event: 'stationStarted', filter: d => d.type === 'mix',
    target: w => w.station('heat').state === 'done' ? w.station('heat') : w.station('mix') },
  { text: 'Collect from the Mixer and take it to the BAGGING table.', event: 'stationStarted', filter: d => d.type === 'package',
    target: w => w.station('mix').state === 'done' ? w.station('mix') : w.station('package') },
  { text: 'Collect the bag, then click the customer to deliver it.', event: 'delivered',
    target: w => w.station('package').state === 'done' ? w.station('package') : w.booths.find(b => b.customer && b.customer.state === CS.WAITING) },
  { text: 'They\'ll leave cash behind. Click their seat to collect it and clean up.', event: 'boothCleared',
    target: w => w.booths.find(b => b.state === 'dirty') },
  { text: 'Careful: never serve while an order shows a red countdown, or they overdose and the cops show up.', duration: 8 },
  { text: 'Pro tip: click several things in a row to queue up to 5 actions. Reach the cash goal!', duration: 7 },
];

class Tutorial {
  constructor(world, steps) {
    this.w = world; this.steps = steps; this.i = 0; this.timer = 0; this.done = false;
    const evs = [...new Set(steps.map(s => s.event).filter(Boolean))];
    this.unsubs = evs.map(ev => Events.on(ev, d => this.onEvent(ev, d)));
    this._enter();
  }
  onEvent(ev, d) {
    if (this.done) return;
    for (let j = this.i; j < this.steps.length; j++) {
      const s = this.steps[j];
      if (s.event === ev && (!s.filter || s.filter(d || {}))) { this.i = j + 1; this._enter(); return; }
    }
  }
  _enter() {
    if (this.i >= this.steps.length) { this.done = true; return; }
    this.timer = this.steps[this.i].duration || 0;
  }
  update(dt) {
    if (this.done) return;
    const s = this.steps[this.i];
    if (s.duration && (this.timer -= dt) <= 0) { this.i++; this._enter(); }
  }
  allowSpawns() { return this.done || this.i >= 3; }  // hold the second customer until the first order is taken
  current() { return this.done ? null : this.steps[this.i]; }
  destroy() { this.unsubs.forEach(f => f()); }
}

/* ============================== 10b. RAID SYSTEM =========================== */
// Serving an order before its minimum wait (level.minWait) overdoses the customer (one normal
// walkout: -15 rep, -$10). Everyone else panics and flees: they're lost customers, but by default
// carry no extra penalty. Two cops walk in, carry the customer out, and new customers start
// arriving again within 3 seconds of the cops leaving.
const RAID = {
  fleePenalty: false,     // true = each fleeing customer also costs -15 rep / -$10 (usually ends the shift)
  panicDelay: 1.0,        // seconds between the overdose and the cops walking in
  pickupTime: 0.9,        // cops stand over the customer this long before lifting
  copSpeed: 3.2,          // tiles per second
  respawnWithin: [1.5, 3] // first new customer arrives this many seconds after the cops exit
};

class RaidSystem {
  constructor(world) { this.w = world; this.state = 'idle'; this.victim = null; this.cops = []; this.timer = 0; this.t = 0; this.sirenTick = 0; }
  get active() { return this.state !== 'idle'; }
  get sirens() { return ["copsIn", "pickup", "copsOut", "bust", "busted"].includes(this.state); }
  get busting() { return ["bust", "busted", "bustDone"].includes(this.state); }
  // Suspicion hit 100: everyone flees, two cops walk up to the cook, and the shift ends as failed (PlayState).
  bust() {
    if (this.busting) return;
    if (this.active) { this.pendingBust = true; return; }   // an overdose raid is already playing out: bust right after it
    const w = this.w, d = LAYOUT.door, p = w.player;
    for (const c of w.customers.list) if (c.present) c.stormOut("scared");
    w.selected = null; p.tasks = []; p.doJob("BUSTED", 999, null);
    this.cops = [-0.55, 0.55].map((off, i) => ({ x: d.x, y: d.y - i * 0.3, facing: 1, anim: i, path: [{ x: p.x + off, y: p.y + 0.35 }] }));
    this.state = "bust"; this.t = 0; this.victim = null;
    w.say("BUSTED!", p, "#ff5a4a", -30);
    Events.emit("busted");
  }

  trigger(victim) {
    if (this.active) return;
    const w = this.w;
    // the overdosed customer drops to the floor in front of their seat
    victim.state = CS.OVERDOSED; victim.path = []; victim.queueIndex = -1;
    const b = victim.booth;
    if (b) { victim.x = b.seatPos.x; victim.y = b.seatPos.y + 0.75; }
    w.score.onStormOut(victim, 'Overdose!');
    w.say('OVERDOSE!', victim, '#b6ff6b', -30);
    w.suspicion.add(CHAOS_CONFIG.suspicion.gain.overdose); w.stress.add(CHAOS_CONFIG.stress.raid);
    Events.emit('overdose', { customer: victim });
    // everyone else panics
    for (const c of w.customers.list) {
      if (c === victim || [CS.LEAVING, CS.STORMING, CS.GONE].includes(c.state)) continue;
      c.stormOut('scared');
    }
    w.selected = null;
    this.victim = victim; this.state = 'panic'; this.timer = RAID.panicDelay; this.t = 0;
  }

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    if (this.sirens && (this.sirenTick -= dt) <= 0) {
      this.sirenTick = 0.45;
      AudioManager.play(SOUND_MAP.siren ? 'siren' : (Math.floor(this.t / 0.45) % 2 ? 'sirenHi' : 'sirenLo'));
      if (SOUND_MAP.siren) this.sirenTick = 999;   // a real siren file plays once per raid
    }
    const v = this.victim;
    switch (this.state) {
      case 'panic':
        if ((this.timer -= dt) <= 0) {
          const d = LAYOUT.door;
          this.cops = [-0.35, 0.35].map((off, i) => ({ x: d.x, y: d.y - i * 0.3, facing: 1, anim: i, path: [{ x: v.x + off, y: v.y - 0.25 }] }));
          this.state = 'copsIn';
          Events.emit('copsArrived');
        }
        break;
      case 'copsIn':
        if (this.moveCops(dt)) { this.state = 'pickup'; this.timer = RAID.pickupTime; }
        break;
      case 'pickup':
        if ((this.timer -= dt) <= 0) {
          if (v.booth) { v.booth.clear(); v.booth = null; }
          v.state = CS.CARRIED;
          const d = LAYOUT.door;
          this.cops.forEach((c, i) => { c.path = [{ x: d.x + 0.3, y: d.y - 0.5 + i * 0.3 }, { x: d.x, y: d.y + i * 0.25 }]; });
          this.state = 'copsOut';
        }
        break;
      case "bust": if (this.moveCops(dt)) { this.state = "busted"; this.timer = 1.6; } break;
      case "busted": if ((this.timer -= dt) <= 0) this.state = "bustDone"; break;
      case 'copsOut': {
        const done = this.moveCops(dt);
        v.x = (this.cops[0].x + this.cops[1].x) / 2; v.y = (this.cops[0].y + this.cops[1].y) / 2;
        if (done) {
          v.state = CS.GONE; this.cops = []; this.victim = null; this.state = 'idle';
          this.w.customers.spawnTimer = Math.min(this.w.customers.spawnTimer, rand(...RAID.respawnWithin));
          Events.emit('raidOver');
          if (this.pendingBust) { this.pendingBust = false; this.bust(); }
        }
        break;
      }
    }
  }
  // Moves both cops along their paths; true once both have arrived.
  moveCops(dt) {
    let arrived = true;
    for (const c of this.cops) {
      c.anim += dt;
      if (!c.path.length) continue;
      arrived = false;
      const t = c.path[0], dx = t.x - c.x, dy = t.y - c.y, d = Math.hypot(dx, dy), step = RAID.copSpeed * dt;
      if (Math.abs(dx - dy) > 0.01) c.facing = dx - dy > 0 ? 1 : -1;
      if (d <= step) { c.x = t.x; c.y = t.y; c.path.shift(); }
      else { c.x += dx / d * step; c.y += dy / d * step; }
    }
    return arrived && this.cops.every(c => !c.path.length);
  }
}

/* ============================== 10c. CHAOS SYSTEMS ========================= */
// Controlled chaos layered on top of the shift: Suspicion, Cook Stress, customer personalities, the bathroom,
// equipment wear, messes and critters, the event + chaos directors, memory fog and bargain-upgrade side effects.
// Every balancing number lives in CHAOS_CONFIG. Systems talk to the existing game through the event bus
// (Events) and small hooks in Customer / Station / PlayerController / World, so the base loop is unchanged.
const CHAOS_CONFIG = {
  debugPanel: true,               // dev panel (` key) → "Chaos debug" buttons. false hides them.

  suspicion: {
    // Suspicion rises in small steps; 100 = BUSTED (police raid, shift fails).
    gain: {
      stormOut: 6,                // a customer storms out angry (× their personality's suspicionMul)
      overdose: 15,               // served too soon (the existing overdose + raid)
      wrongOrder: 5,              // wrong bag handed over during memory fog
      meltdown: 6,                // the cook melts down at max stress

// ---- Suspicion: a shift-wide 0–100 meter. 100 → BUSTED ----
class SuspicionSystem {
  constructor(world) { this.w = world; this.value = 0; this.peak = 0; this.lastIncident = -99; this.beat = 0; this.flash = 0; }
  get level() { const L = CHAOS_CONFIG.suspicion.levels; let i = 0; while (i + 1 < L.length && this.value >= L[i + 1][0]) i++; return i; }
  get label() { return CHAOS_CONFIG.suspicion.levels[this.level][1]; }
  // add(n): n > 0 raises suspicion (an incident), n < 0 lowers it. at = optional spot for a small floater.
  add(n, at = null, note = null) {
    const w = this.w; if (!n || w.raid.state === 'bust' || w.raid.state === 'busted') return;
    if (n > 0) {
      if (w.inspectorIn) n *= CHAOS_CONFIG.suspicion.inspectorMul;
      this.lastIncident = w.time; this.flash = 1;
      Events.emit('suspicionUp', { amount: n });
    }
    this.value = clamp(this.value + n, 0, 100);
    this.peak = Math.max(this.peak, this.value);
    if (at && Math.abs(n) >= 2) w.say(note || `${n > 0 ? '+' : ''}${Math.round(n)} suspicion`, at, n > 0 ? '#ff9e5e' : '#9fd8ff', -40);
    if (this.value >= 100) w.raid.bust();
  }
  update(dt) {
    const w = this.w, C = CHAOS_CONFIG.suspicion, ps = C.perSec;
    if (w.raid.active) return;
    let gain = 0;
    const queued = w.customers.queue.length; if (queued > 3) gain += (queued - 3) * ps.queueCrowd;
    gain += w.messes.length * ps.mess * w.freshenerMul();
    gain += w.stations.filter(s => s.broken).length * ps.broken;
    gain += w.bathroom.problemCount * ps.bathroomProblem * w.freshenerMul();
    gain += w.critters.length * ps.critter;
    for (const c of w.customers.list) if (c.present && c.patienceFrac < 0.15) gain += ps.furious * c.persona.suspicionMul;
    for (const b of w.booths) if (b.state === 'dirty' && w.time - (b.dirtySince || w.time) > 12) gain += ps.dirtyBoothOld;
    if (gain > 0) this.value = clamp(this.value + gain * dt * (w.inspectorIn ? C.inspectorMul : 1), 0, 100);
    else if (w.time - this.lastIncident > C.calmAfter) this.value = Math.max(0, this.value - C.calmPerSec * dt);
    this.peak = Math.max(this.peak, this.value);
    if (this.value >= 100) w.raid.bust();
    this.flash = Math.max(0, this.flash - dt * 2);
    if (this.value >= C.criticalAt && (this.beat -= dt) <= 0) { this.beat = 1.4 - (this.value - C.criticalAt) / 40; AudioManager.play('heartbeat'); }
  }
  // patience drain multiplier everyone feels as suspicion climbs (paranoid customers feel it more)
  patienceMul(c) {
    const C = CHAOS_CONFIG.suspicion, extra = this.value >= C.criticalAt ? 0.2 : this.value >= C.nervousAt ? 0.1 : 0;
    return 1 + extra * c.persona.paranoia;
  }
}

// ---- Cook Stress: rises with problems around the cook, falls during calm. 100 → meltdown ----
class StressSystem {
  constructor(world) { this.w = world; this.value = 0; this.meltdowns = 0; }
  add(n) { if (this.w.player.melting || this.w.raid.active) return; this.value = clamp(this.value + n, 0, 100); if (this.value >= 100) this.meltdown(); }
  update(dt) {
    const w = this.w, S = CHAOS_CONFIG.stress;
    if (w.raid.active || w.player.melting) return;
    const angry = w.customers.list.filter(c => c.present && c.patienceFrac < ANGRY.at).length;
    const problems = w.problemCount();
    const gain = angry * S.angryCustomerPerSec + problems * S.problemPerSec;
    if (gain > 0) this.value = clamp(this.value + gain * dt, 0, 100);
    if (this.value >= 100) return this.meltdown();   // check before the calm-down below
    if (!angry && !problems) this.value = Math.max(0, this.value - S.calmPerSec * dt);
  }
  meltdown() {
    const w = this.w, S = CHAOS_CONFIG.stress;
    this.meltdowns++;
    w.player.doJob('MELTDOWN', S.meltdownTime, () => { this.value = S.afterMeltdown; }, { melt: true });
    w.say('MELTDOWN!', w.player, '#ff6b6b', -30);
    w.suspicion.add(CHAOS_CONFIG.suspicion.gain.meltdown, w.player);
    Events.emit('meltdown');
  }
}

// ---- Customer personalities ----
function rollPersonality(w) {
  const allowed = CHAOS_CONFIG.personality.unlock[w.levelIndex] || Object.keys(PERSONALITIES);
  return weightedPick(Object.fromEntries(allowed.map(k => [k, PERSONALITIES[k].weight])));
}
// Patience drain multiplier for one customer: personality, suspicion and trouble around them.
function chaosPatienceMul(w, c) {
  const P = c.persona; let m = P.decayMul * w.suspicion.patienceMul(c);
  if (P.sensitivity > 1) {   // complainers: mess, broken gear, bathroom trouble and dirty seats get to them
    const issues = w.messes.length + w.stations.filter(s => s.broken).length + w.bathroom.problemCount * 0.7 + w.booths.filter(b => b.state === 'dirty').length * 0.3;
    m *= 1 + (P.sensitivity - 1) * 0.12 * Math.min(issues, 6);
  }
  const weird = w.critters.length + (w.flicker > 0 ? 1 : 0) + w.bags.length + (w.inspectorVisible ? 1 : 0);
  if (weird) m *= 1 + 0.1 * weird * P.paranoia;              // strange stuff rattles everyone, paranoid people most
  if (c.arguing > 0) m *= 2;
  else if (w.customers.list.some(o => o.arguing > 0 && Math.hypot(o.x - c.x, o.y - c.y) < 4)) m *= 1.25;   // uncomfortable neighbors
  for (const cr of w.critters) if (Math.hypot(cr.x - c.x, cr.y - c.y) < CHAOS_CONFIG.critters.scareRadius) { m *= CHAOS_CONFIG.critters.nearPatienceMul * (P.paranoia > 1 ? 1.2 : 1); break; }
  if ((c.state === CS.QUEUED || c.state === CS.ENTERING) && w.customers.list.some(o => o.personaKey === 'indecisive' && o.state === CS.BROWSING)) m *= 1.15;   // stuck behind someone who can't decide
  return m;
}
// Emotes and muttered lines (called from Customer.update). Situational emotes beat personality ones.
function updateCustomerMood(c, dt) {
  const w = c.w, Pc = CHAOS_CONFIG.personality;
  if (c.emote && (c.emote.t += dt) > 1.8) c.emote = null;
  if (c.emoteTimer == null) c.emoteTimer = rand(2, Pc.emoteEvery[1]);
  if (!c.present || c.state === CS.IN_BATH || (c.emoteTimer -= dt) > 0) return;
  c.emoteTimer = rand(...Pc.emoteEvery) * (c.persona.mystery ? 0.5 : 1);
  let kind = c.persona.emote;
  if (w.suspicion.value >= CHAOS_CONFIG.suspicion.nervousAt && Math.random() < 0.35 * c.persona.paranoia) kind = 'eye';   // glancing around nervously
  if (c.state === CS.BATH_LINE) kind = 'toilet';
  if (!kind) return;
  c.emote = { kind, t: 0 };
  const lines = PERSONALITY_LINES[c.personaKey];
  if (lines && Math.random() < 0.35 && c.seated) w.say(pick(lines), c, '#efe3c4', -18);
}
// Indecisive customers may change their order once, shortly after ordering.
function maybeChangeOrder(c) {
  const w = c.w;
  if (c.changeAt == null || w.time < c.changeAt || c.state !== CS.WAITING) return;
  c.changeAt = null;
  const others = w.level.recipes.filter(r => r !== c.recipe); if (!others.length) return;
  c.recipe = pick(others); c.orderTime = w.time;   // the wait timer starts over for the new order
  w.say(`Actually... ${RECIPES[c.recipe].name}.`, c, '#ffe066', -18);
  c.emote = { kind: 'question', t: 0 };
  Events.emit('orderChanged', { customer: c });
}
// Personality payoffs when a customer pays (Regular streaks, weirdo quirks, the mystery customer's secret).
function personalityOnPaid(c, booth) {
  const w = c.w, s = w.session, Pc = CHAOS_CONFIG.personality;
  if (c.personaKey === 'loyal' && c.tipFrac > 0.6) {
    s.loyalHappy = (s.loyalHappy || 0) + 1;
    if (s.loyalHappy % Pc.loyalStreakBonus === 0) {
      booth.cash += Pc.loyalBonusCash; w.suspicion.add(-CHAOS_CONFIG.suspicion.loss.loyalStreak);
      w.say(`Regulars love you  +$${Pc.loyalBonusCash}`, booth, '#ffd166', -30);
    }
  }
  if (c.persona.quirky && Math.random() < 0.5) w.say(pick(WEIRDO_QUIRKS), booth, '#d7b8ff', -30);
  if (c.persona.mystery) resolveMystery(c, booth, false);
}
// The mystery customer: usually just some guy. Sometimes a huge tip. Sometimes they noticed things.
function resolveMystery(c, at, walkedOut) {
  const w = c.w, M = CHAOS_CONFIG.mystery;
  if (walkedOut) { w.suspicion.add(CHAOS_CONFIG.suspicion.gain.mysteryWalkout, at, 'They saw everything.'); return; }
  let o = weightedPick(M.outcome);
  if (o === 'suspicious' && w.suspicion.value < 40 && w.problemCount() < 2) o = 'nothing';
  if (o === 'bigTip') { if (at.cash != null) at.cash += M.bigTip; w.say(`Who WAS that?  +$${M.bigTip}`, at, '#ffd166', -30); }
  else if (o === 'suspicious') w.suspicion.add(6, at, 'Took notes. Uh oh.');
  else w.say('...just some guy.', at, '#cfc8e0', -30);
}
// Placeholder emote icons (emoji). SPRITE HOOK: emote_<kind> replaces each one.
const EMOTE_GLYPHS = { clock: '⏱', question: '❓', dots: '💬', grumble: '😤', eye: '👀', heart: '❤', spiral: '🌀', shades: '🕶', toilet: '🧻', clipboard: '📋', angry: '💢' };
function drawEmote(ctx, x, y, kind, t) {
  const a = clamp(t < 0.2 ? t / 0.2 : (1.8 - t) / 0.4, 0, 1), s = 0.8 + 0.2 * Math.min(1, t / 0.2);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fillStyle = '#efe8d4'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(-11, 17); ctx.lineTo(-1, 12); ctx.fillStyle = '#efe8d4'; ctx.fill();
  if (!uiSprite(ctx, `emote_${kind}`, -10, -10, 20, 20)) {
    ctx.font = '15px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#222'; ctx.fillText(EMOTE_GLYPHS[kind] || '?', 0, 1);
  }
  ctx.restore();
}

  get depth() { return -100 + (this.x + this.y) * 0.01; }   // flat on the floor: under everything

}

// ---- Chaos level: an internal 0–100 reading of how bad things are (never shown to the player) ----
class ChaosMeter {
  constructor(w) { this.w = w; this.value = 0; this.level = 'low'; this.override = 0; this.overrideT = 0; }
  raw() {
    const w = this.w, C = CHAOS_CONFIG.chaos.weights;
    const present = w.customers.list.filter(c => c.present && c.state !== CS.SAMPLING && c.state !== CS.LINGER);
    const anger = present.reduce((s, c) => s + (1 - c.patienceFrac), 0) / Math.max(3, present.length);   // damped when the room is nearly empty
    return anger * C.anger + w.suspicion.value / 100 * C.suspicion + w.stations.filter(s => s.broken).length * C.broken
      + w.bathroom.problemCount * C.bathroom + w.messes.length * C.mess + w.customers.list.filter(c => c.hasOrder).length * C.orders
      + w.stress.value / 100 * C.stress + w.critters.length * C.critter + w.director.activeCount() * C.event;
  }
  update(dt) {
    let v = clamp(this.raw(), 0, 100);
    if (this.overrideT > 0) { this.overrideT -= dt; v = Math.max(v, this.override); }   // debug: "Set chaos high"
    this.value += (v - this.value) * Math.min(1, dt * 1.5);                              // smoothed
    const L = CHAOS_CONFIG.chaos.levels;
    this.level = this.value >= L.extreme ? 'extreme' : this.value >= L.high ? 'high' : this.value >= L.medium ? 'medium' : 'low';
  }

// ---- Critters (rat / cat / pigeon): wander, spook nearby customers, click to shoo out ----
const CRITTER_TYPES = { rat: { speed: 2.0, line: 'RAT!!', glyph: '🐀' }, cat: { speed: 1.1, line: '...is that a cat?', glyph: '🐈' }, pigeon: { speed: 1.6, line: '*coo* *COO*', glyph: '🐦' } };

  constructor(w, type) {

  }

// ---- Grunge art kit ---------------------------------------------------------
// Everything below is vector "placeholder" art. Each prop has one draw function in PROP_DRAWERS.
// drawProp() uses a sprite instead when ASSETS_LOADED is true and that key exists in SPRITE_MANIFEST.
const INK = '#1d1510';      // shared outline color
const OUTLINE = 1.6;
const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// Seeded RNG so procedural dirt, litter and wood grain look identical every frame and every run.
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

const ISO_RX = ISO.TW / 2 * Math.SQRT2, ISO_RY = ISO.TH / 2 * Math.SQRT2;   // screen radii of a 1-tile world circle

// Rectangle on the room-facing (+y) side of a box. u = world x range, z = height range.
function frontQuad(ctx, yF, u0, u1, z0, z1, fill, stroke = INK, lw = 1) { quad(ctx, P(u0, yF, z0), P(u1, yF, z0), P(u1, yF, z1), P(u0, yF, z1), fill, stroke, lw); }
// Rectangle on the right-facing (+x) side. v = world y range.
function sideQuad(ctx, xF, v0, v1, z0, z1, fill, stroke = INK, lw = 1) { quad(ctx, P(xF, v0, z0), P(xF, v1, z0), P(xF, v1, z1), P(xF, v0, z1), fill, stroke, lw); }

function inkLine(ctx, a, b, color, lw = 2.5) { ctx.lineCap = 'round'; line(ctx, a, b, INK, lw + 2); line(ctx, a, b, color, lw); ctx.lineCap = 'butt'; }

// Lit box: front (+y) face mid-tone, side (+x) face dark, top light, with a vertical falloff gradient.
function box(ctx, x, y, w, d, z0, z1, color, lw = OUTLINE) {

// Flat soft blob lying on a horizontal plane (stains, grime, shadows).
function stain(ctx, x, y, z, r, color) {

function drawFridge(ctx, cx, cy) {

  inkLine(ctx, P(x0 + w - 0.13, fy, 34), P(x0 + w - 0.13, fy, 58), '#9d9a8c', 2.5);

  for (let i = 0; i < 6; i++) {
    const q = P(x0 + 0.12 + rng() * 0.6, fy, 20 + rng() * 64);

  box(ctx, x0, y0, w, d, H - 4, H, '#cbbb8a');                                        // laminate slab
  for (let i = 0; i < 4; i++) {                                                       // chipped edges
    const u = x0 + 0.1 + rng() * (w - 0.3), a = P(u, fy, H), b = P(u + 0.08 + rng() * 0.06, fy, H), c = P(u + 0.05, fy, H - 3);
    poly(ctx, [a, b, c], '#8a6f47', INK, 0.8);
  }
  for (let i = 0; i < 4; i++) stain(ctx, x0 + 0.15 + rng() * (w - 0.3), y0 + 0.15 + rng() * (d - 0.3), H, 0.06 + rng() * 0.1, 'rgba(90,60,20,0.35)');
  // splatter around the bowl
  const muck = st.item ? RECIPES[st.item.recipe].color : '#8a8468';
  for (let i = 0; i < 8; i++) { const q = P(cx - 0.35 + rng() * 0.7, cy - 0.3 + rng() * 0.6, H); ellipse(ctx, q.x, q.y, 1 + rng() * 2.5, 0.8 + rng() * 1.2, muck); }
  // mixing bowl
  const c = P(cx, cy, H + 13), rx = 0.3 * ISO_RX, ry = 0.3 * ISO_RY;
  ctx.beginPath(); ctx.moveTo(c.x - rx, c.y); ctx.quadraticCurveTo(c.x - rx * 0.8, c.y + ry + 16, c.x, c.y + ry + 13);
  ctx.quadraticCurveTo(c.x + rx * 0.8, c.y + ry + 16, c.x + rx, c.y); ctx.closePath();
  const bg = ctx.createLinearGradient(c.x - rx, 0, c.x + rx, 0); bg.addColorStop(0, '#e9e4d4'); bg.addColorStop(1, '#8f8a7a');
  ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = OUTLINE; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(c.x, c.y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = '#b9b4a2'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(c.x, c.y + 1.5, rx * 0.8, ry * 0.75, 0, 0, Math.PI * 2); ctx.fillStyle = muck; ctx.fill();
  ellipse(ctx, c.x - rx * 0.7, c.y + 8, 2, 3, 'rgba(0,0,0,0.25)');                   // chip on the bowl
  // wooden spoon, stirring while working
  const a = st.state === 'working' && !REDUCED_MOTION ? t * 7 : -0.6;
  const sx = c.x + Math.cos(a) * rx * 0.35, sy = c.y + 1 + Math.sin(a) * ry * 0.35;
  inkLine(ctx, { x: sx, y: sy }, { x: sx + 16, y: sy - 24 }, '#a8763d', 2.6);
  ellipse(ctx, sx, sy, 3.5, 2.2, '#a8763d');
}

// ---- Room shell: floor, walls and litter, drawn once into an offscreen canvas ----
// ---- Swappable room art (asset-swap "Room" group) ----
// Textures are mapped onto the room's planes in isometric perspective; the Size slider scales the
// repeat and the nudges slide it. Wall art is drawn flat on a wall, keeping the image's proportions.
const WALL_H = 100, WALLPAPER_SPAN = 2;                       // one wallpaper copy spans 2 tiles × the wall height
const WALL_TILE_PX = Math.hypot(ISO.TW / 2, ISO.TH / 2);      // on-screen length of one tile along a wall
const STATIC_KEYS = new Set(['floor', 'wall_back', 'wall_left', 'linoleum', 'door', 'sign_door', 'poster', 'window']);   // baked into the room layer
function floorPattern(ctx, key) {
  const img = tintedImg(key, Sprites.entry(key).img), pat = ctx.createPattern(img, 'repeat');
  const tw = Sprites.tweaks[key] || {}, s = tw.scale ?? 1;
  pat.setTransform(new DOMMatrix([s * ISO.TW / 2 / img.width, s * ISO.TH / 2 / img.width, -s * ISO.TW / 2 / img.height, s * ISO.TH / 2 / img.height, ISO.OX + (tw.x || 0), ISO.OY - (tw.y || 0)]));
  return pat;
}
function wallPattern(ctx, key, axis) {
  const img = tintedImg(key, Sprites.entry(key).img), pat = ctx.createPattern(img, 'repeat');
  const tw = Sprites.tweaks[key] || {}, s = tw.scale ?? 1, span = WALLPAPER_SPAN * s;
  // texture x runs left→right on screen: down the back wall (+x), up the side wall (−y), so text never mirrors
  const dy = axis === 'x' ? ISO.TH / 2 : -ISO.TH / 2;
  pat.setTransform(new DOMMatrix([ISO.TW / 2 * span / img.width, dy * span / img.width, 0, WALL_H * s / img.height, ISO.OX + (tw.x || 0), ISO.OY - WALL_H - (tw.y || 0)]));
  return pat;
}
// Where each piece of wall art goes: axis 'x' = back wall (u = tiles along x), 'y' = side wall (u = tiles along y),
// z = px above the floor (center, or bottom for anchor 'bottom'), h = height in px. Width follows the image.
const WALL_DECOR = {
  door:      { axis: 'y', u: 10.3, z: 0,  h: 74, anchor: 'bottom' },
  sign_door: { axis: 'y', u: 10.3, z: 86, h: 18 },
  poster:    { axis: 'y', u: 4.78, z: 64, h: 40 },
  window:    { axis: 'x', u: 12.2, z: 60, h: 44 },
  bathroom_door: { axis: "y", u: 2.15, z: 0, h: 72, anchor: "bottom" },   // section 10c
  sign_neon: { axis: 'x', u: 8.4,  z: 88, h: 26 },
};
function drawWallDecorSprite(ctx, key) {
  const d = WALL_DECOR[key], img = tintedImg(key, Sprites.entry(key).img), tw = Sprites.tweaks[key] || {}, s = tw.scale ?? 1;
  const h = d.h * s, wTiles = h * img.width / img.height / WALL_TILE_PX;
  const uc = d.u + (tw.x || 0) / WALL_TILE_PX, z0 = (d.anchor === 'bottom' ? d.z : d.z - h / 2) + (tw.y || 0);
  const at = (u, z) => d.axis === 'x' ? P(u, 0, z) : P(0, u, z);
  // the side wall runs right-to-left on screen (higher u = further left), so its image starts at the high end
  const uL = d.axis === 'x' ? uc - wTiles / 2 : uc + wTiles / 2, uR = d.axis === 'x' ? uc + wTiles / 2 : uc - wTiles / 2;
  const o = at(uL, z0 + h), ux = at(uR, z0 + h), vz = at(uL, z0);
  ctx.save(); ctx.transform((ux.x - o.x) / img.width, (ux.y - o.y) / img.width, (vz.x - o.x) / img.height, (vz.y - o.y) / img.height, o.x, o.y);
  ctx.drawImage(img, 0, 0); ctx.restore();
}

function drawWall(ctx, axis, len, rng) {
  const H = WALL_H, at = (u, z) => axis === 'x' ? P(u, 0, z) : P(0, u, z);
  const wkey = axis === 'x' ? 'wall_back' : 'wall_left';
  if (useSprite(wkey)) {                                       // SPRITE HOOK: wallpaper
    const face = [at(0, 0), at(len, 0), at(len, H), at(0, H)];
    poly(ctx, face, wallPattern(ctx, wkey, axis)); poly(ctx, face, null, INK, 2);
    return;
  }
  const base = axis === 'x' ? '#8d6639' : '#7a5530', PW = 0.6, ang = axis === 'x' ? 0.4636 : -0.4636;
  for (let u = 0; u < len - 1e-6; u += PW) {
    const u1 = Math.min(len, u + PW), v = (rng() - 0.5) * 0.14;
    const tp = at(u, H), bt = at(u, 0);
    const g = ctx.createLinearGradient(tp.x, tp.y, bt.x, bt.y);
    g.addColorStop(0, shade(base, v - 0.12)); g.addColorStop(0.5, shade(base, v + 0.04)); g.addColorStop(1, shade(base, v - 0.2));
